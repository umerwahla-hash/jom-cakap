const SEC={dengar:{nm:'Kefahaman Mendengar',en:'Listening',ico:'👂'},kosa:{nm:'Kosa Kata',en:'Vocabulary',ico:'🃏'},ejaan:{nm:'Ejaan',en:'Spelling',ico:'🔤'},
  tata:{nm:'Tatabahasa',en:'Grammar',ico:'🧩'},isi:{nm:'Isi Tempat Kosong',en:'Fill in the blank',ico:'✏️'},susun:{nm:'Susun Ayat',en:'Sentence order',ico:'🧱'},
  faham:{nm:'Kefahaman Bacaan',en:'Reading comprehension',ico:'📖'},bacaan:{nm:'Bacaan Lantang',en:'Reading aloud',ico:'🗣️'},perbualan:{nm:'Perbualan Gambar',en:'Picture conversation',ico:'🖼️'}};
const singleWords=u=>u.wordKeys.filter(w=>!/\s|-/.test(w));
const band=p=>p>=85?['Cemerlang','Excellent','🏆']:p>=70?['Baik','Good','🌟']:p>=50?['Sederhana','Getting there','🌱']:['Perlu usaha','Needs more practice','💪'];
let QID=0;const qid=p=>p+':'+(QID++);

/* ---------- question generators (all return plain data) ---------- */
function picOpts(u,w,n=3){const pool=u.wordKeys.filter(x=>x!==w&&WORDS[x].pic!==WORDS[w].pic);const src=pool.length>=n-1?pool:ALL_WORDS.filter(x=>x!==w&&WORDS[x].pic!==WORDS[w].pic);return shuffle([w,...shuffle(src).slice(0,n-1)])}
function genListenWord(u){const w=pick(u.wordKeys);const W=WORDS[w];const opts=picOpts(u,w);
  return {id:'lw:'+w,sec:'dengar',unit:u.id,ask:'Dengar. Pilih gambar yang betul.',en:'Listen, then choose the matching picture.',audio:w,opts:opts.map(o=>({t:'',pic:WORDS[o].pic,lab:o})),a:opts.indexOf(w),big:true,
    why:`You heard “${w}”, which means ${W.en} ${W.pic}.`,whyMs:`“${w}” = ${W.pic}`,model:w}}
function genListenSentence(u){const B=u.build;const k=Math.random()*B.length|0;const others=shuffle(B.filter((_,j)=>j!==k)).slice(0,2);const opts=shuffle([B[k],...others]);
  return {id:'ls:'+u.id+k,sec:'dengar',unit:u.id,ask:'Dengar ayat ini. Pilih gambar yang betul.',en:'Listen to the sentence, then choose the matching picture.',audio:fill(B[k][0]),opts:opts.map(o=>({t:'',pic:o[2],lab:fill(o[0])})),a:opts.indexOf(B[k]),big:true,
    why:`The sentence was “${fill(B[k][0])}” (${fill(B[k][1])}).`,whyMs:fill(B[k][0]),model:fill(B[k][0])}}
function genVocab(u){const w=pick(u.wordKeys);const W=WORDS[w];const opts=picOpts(u,w);
  return {id:'kv:'+w,sec:'kosa',unit:u.id,ask:'Apakah nama gambar ini?',en:'What is this picture called?',pic:W.pic,opts:opts.map(o=>({t:o})),a:opts.indexOf(w),
    why:`${W.pic} is “${w}” (${W.en}). Say it in syllables: ${W.syl.join(' · ')}.`,whyMs:`${W.pic} = ${w}`,model:w}}
function genMeaning(u){const w=pick(u.wordKeys);const W=WORDS[w];const opts=picOpts(u,w);
  return {id:'km:'+w,sec:'kosa',unit:u.id,ask:`Pilih gambar untuk perkataan “${w}”.`,en:`Choose the picture for "${w}".`,audio:w,opts:opts.map(o=>({t:'',pic:WORDS[o].pic,lab:o})),a:opts.indexOf(w),big:true,
    why:`“${w}” means ${W.en} ${W.pic}.`,whyMs:`${w} = ${W.pic}`,model:w}}
function misspell(w){const V='aeiou';const out=new Set();const tries=[
  ()=>{const i=[...w].findIndex((c,j)=>V.includes(c)&&j>0);if(i<0)return null;const v=V.replace(w[i],'');return w.slice(0,i)+v[Math.random()*v.length|0]+w.slice(i+1)},
  ()=>{const i=[...w].map((c,j)=>V.includes(c)?j:-1).filter(j=>j>0&&j<w.length-1);if(!i.length)return null;const j=pick(i);return w.slice(0,j)+w.slice(j+1)},
  ()=>{const j=1+(Math.random()*(w.length-2)|0);return w.slice(0,j)+w[j+1]+w[j]+w.slice(j+2)},
  ()=>w.replace(/ng/,'n').replace(/ny/,'n'),()=>w.replace(/c/,'ch'),()=>w.replace(/k$/,''),()=>w.replace(/u/,'oo'),()=>w.replace(/e/,'a')];
  for(let n=0;n<40&&out.size<2;n++){const f=pick(tries)();if(f&&f!==w&&f.length>=2)out.add(f)}return [...out]}
function genSpell(u){const ws=singleWords(u).filter(w=>w.length>=4);const w=pick(ws.length?ws:singleWords(u));const W=WORDS[w];const wrong=misspell(w);if(wrong.length<2)return genVocab(u);const opts=shuffle([w,...wrong]);
  return {id:'ej:'+w,sec:'ejaan',unit:u.id,ask:'Pilih ejaan yang betul.',en:'Choose the correct spelling.',pic:W.pic,audio:w,opts:opts.map(o=>({t:o})),a:opts.indexOf(w),
    why:`The correct spelling is “${w}”: ${W.syl.join(' · ')}. Spell it syllable by syllable.`,whyMs:`${w} (${W.syl.join('-')})`,model:w}}
function genCloze(u){const B=pick(u.build);const t=toks(B[0]);const cand=t.map((x,j)=>j).filter(j=>j>0&&t[j].length>=3&&!/^(saya|kami|ini|itu|di|ke|dan|yang|ialah|sedang|dengan|pada)$/i.test(t[j]));
  if(!cand.length)return genVocab(u);const j=pick(cand);const ans=t[j];
  const pool=[...new Set([...singleWords(u),...B[3]].filter(x=>x.toLowerCase()!==ans.toLowerCase()&&!t.map(y=>y.toLowerCase()).includes(x.toLowerCase())))];
  const opts=shuffle([ans,...shuffle(pool).slice(0,2)]);const shown=t.map((x,k)=>k===j?'_____':x).join(' ')+'.';
  return {id:'is:'+u.id+':'+t.join('_')+':'+j,sec:'isi',unit:u.id,ask:'Pilih perkataan yang betul untuk mengisi tempat kosong.',en:'Choose the right word to fill the blank.',sentence:shown,pic:B[2],opts:opts.map(o=>({t:o})),a:opts.indexOf(ans),
    why:`The full sentence is “${fill(B[0])}” (${fill(B[1])}). Only “${ans}” makes sense here.`,whyMs:fill(B[0]),model:fill(B[0])}}
function genOrder(u){const ok=u.build.filter(b=>toks(b[0]).length>=3);const B=pick(ok.length?ok:u.build);const t=toks(B[0]);const right=t.join(' ');const wrong=new Set();
  for(let n=0;n<40&&wrong.size<2;n++){const s=shuffle(t).join(' ');if(s.toLowerCase()!==right.toLowerCase()&&![...wrong].some(x=>x.toLowerCase()===s.toLowerCase()))wrong.add(s)}
  if(wrong.size<2)return genCloze(u);
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase().replace(/\b(ali|siti|ravi|mei|ling|cikgu|pak|cik|mak|ahmad|rosnah|lim|hassan|aminah|darjah|satu)\b/g,m=>m.charAt(0).toUpperCase()+m.slice(1));
  const opts=shuffle([right,...wrong]).map(s=>s===right?fill(B[0]):cap(s)+'.');const a=opts.indexOf(fill(B[0]));
  return {id:'su:'+u.id+':'+t.join('_'),sec:'susun',unit:u.id,ask:'Pilih ayat yang betul susunannya.',en:'Choose the sentence in the correct order.',pic:B[2],opts:opts.map(o=>({t:o})),a,
    why:`“${fill(B[0])}” means “${fill(B[1])}”. In Malay, the person or thing comes first, then what they do, then the rest.`,whyMs:fill(B[0]),model:fill(B[0])}}
function genStory(u,k){const ST=u.story;const q=ST.q[k];const line=ST.lines[q[4]];
  return {id:'kf:'+u.id+':'+k,sec:'faham',unit:u.id,story:u.id,ask:q[0],en:q[1],opts:q[2].map(o=>({t:o[0],pic:o[1]})),a:q[3],
    why:`The answer is in this sentence: “${line[0]}” (${line[1]}).`,whyMs:line[0],model:line[0]}}
function genGrammar(id,k){const g=GRAMMAR_BY_ID[id];const q=g.q[k];
  return {id:'tb:'+id+':'+k,sec:'tata',topic:id,ask:q[1]?'Pilih jawapan yang betul.':(q[0]==='Pilih ayat yang betul.'?'Pilih ayat yang betul.':'Pilih perkataan yang betul.'),en:g.en,sentence:q[0]==='Pilih ayat yang betul.'?'':q[0],answerLine:q[1],opts:q[2].map(o=>({t:o})),a:q[3],
    why:q[4],whyMs:q[0]==='Pilih ayat yang betul.'?q[2][q[3]]:q[0].replace('___',q[2][q[3]]),model:''}}
const grammarFor=u=>u.grammar||['tanya'];
function pickGrammar(ids,n){const all=ids.flatMap(id=>GRAMMAR_BY_ID[id].q.map((_,k)=>[id,k]));return shuffle(all).slice(0,n).map(([id,k])=>genGrammar(id,k))}
function uniq(qs){const seen=new Set();return qs.filter(q=>q&&!seen.has(q.id)&&seen.add(q.id))}
function unitQuiz(u){const st=shuffle(u.story.q.map((_,k)=>k)).slice(0,2);
  return uniq([genListenWord(u),genListenSentence(u),genVocab(u),genMeaning(u),genSpell(u),genCloze(u),genCloze(u),genOrder(u),...st.map(k=>genStory(u,k)),...pickGrammar(grammarFor(u),2)])}
function practicePaper(scope){const us=scope.length?scope:[U()];const ru=()=>pick(us);const story=pick(us);
  const A=uniq([...Array(8)].map((_,i)=>i%2?genListenSentence(ru()):genListenWord(ru()))).slice(0,5);
  const B=uniq([...Array(8)].map((_,i)=>i%2?genMeaning(ru()):genVocab(ru()))).slice(0,4);
  const C=uniq([...Array(5)].map(()=>genSpell(ru()))).slice(0,2);
  const D=pickGrammar([...new Set(us.flatMap(grammarFor).concat(['tanya','bilangan','hubung','sendi']))],6);
  const E=uniq([...Array(8)].map(()=>genCloze(ru()))).slice(0,4);
  const F=uniq([...Array(6)].map(()=>genOrder(ru()))).slice(0,3);
  const G=story.story.q.map((_,k)=>genStory(story,k));
  return [...A,...B,...C,...D,...E,...F,...G]}

/* ---------- mistakes bank and section stats ---------- */

  return `${st?`<details class="card passage" ${state.openPassage?'open':''}><summary>📖 ${esc(st.title)}: baca petikan</summary><div class="story">${st.lines.map(l=>`<p style="font-size:20px">${esc(l[0])} ${say(l[0],'sm')}</p>`).join('')}</div></details>`:''}

    <div class="row" style="gap:12px;align-items:flex-start">${q.audio?`<button class="btn audio" data-act="qplay">🔊 Dengar</button>`:say(q.ask,'sm')}
      <div class="grow"><p style="font-size:22px;font-weight:700">${esc(q.ask)}</p><p class="en">${esc(q.en||'')}</p></div></div>
    ${q.pic&&!q.big?`<div style="font-size:84px;text-align:center;line-height:1.1">${q.pic}</div>`:''}
    ${q.sentence?`<p class="read qsent">${esc(q.sentence)}</p>`:''}
    ${q.answerLine?`<p class="small" style="font-size:18px">Jawapan: <b>${esc(q.answerLine)}</b></p>`:''}
  </div>
  <div class="choices ${q.big?'four':''}" style="${q.big?'':'grid-template-columns:1fr'}">${q.opts.map((o,j)=>{const cls=state.chosen===undefined?'':j===q.a?'right':j===state.chosen?'wrong':'';
    return `<button class="choice ${q.big?'':'txt'} ${cls}" data-act="qans" data-j="${j}" ${state.locked?'aria-disabled="true"':''}>${o.pic?`<span class="pic">${o.pic}</span>`:''}${o.t?`<span>${esc(o.t)}</span>`:''}${q.big&&state.chosen!==undefined&&o.lab?`<span class="small">${esc(o.lab)}</span>`:''}</button>`}).join('')}</div>`}
function whyHTML(q,ok,practice){const correct=q.opts[q.a];
  return `<div class="${ok?'ok-note':'explain'} col" style="gap:8px">
    <p style="font-size:22px;font-weight:700">${ok?pick(PRAISE)+' Betul!':'Belum tepat. Jawapan yang betul:'}</p>
    ${ok?'':`<div class="row" style="gap:10px">${correct.pic?`<span style="font-size:40px">${correct.pic}</span>`:''}<b style="font-size:24px">${esc(correct.t||correct.lab||'')}</b>${say(correct.t||correct.lab||q.model||'','sm')}</div>`}
    <p class="whyline"><b>Kenapa?</b> ${esc(q.why)}</p>
    ${q.whyMs?`<div class="row" style="gap:8px">${say(q.whyMs,'sm')}<span style="font-size:19px;font-weight:700">${esc(q.whyMs)}</span></div>`:''}
    ${practice?`<div class="row" style="justify-content:flex-end"><button class="btn big" data-act="qnext">${ok?'Seterusnya →':'Faham! Seterusnya →'}</button></div>`:''}</div>`}

/* ---------- quiz runner: practice (instant feedback) or exam (marked at end) ---------- */
SCREENS.quiz=c=>{const kind=c.kind;let qs,title,mode='practice',back='latihan',scopeU=null;
  if(kind==='kuiz'){scopeU=c.unit?UNIT_BY_ID[c.unit]:U();qs=unitQuiz(scopeU);title='Kuiz · '+scopeU.nm;back=c.from||'unit'}
  else if(kind==='kertas'){const scope=c.scope==='all'?UNITS:(learnedUnits().length?learnedUnits():[U()]);qs=practicePaper(scope);title='Kertas Latihan';mode='exam'}
  else if(kind==='harian'){const ms=Object.values(S.mistakes).map(m=>m.q);const u=U();qs=uniq([...shuffle(ms).slice(0,2),...shuffle(unitQuiz(u))]).slice(0,5);title='5 Soalan Hari Ini';back='home'}
  else if(kind==='kesilapan'){qs=shuffle(Object.values(S.mistakes).map(m=>m.q)).slice(0,10);title='Kesilapan Saya'}
  else if(kind==='nahu'){const g=GRAMMAR_BY_ID[c.id];qs=shuffle(g.q.map((_,k)=>genGrammar(c.id,k)));title=g.nm;back='nahu'}
  if(!qs.length){app.innerHTML=bar(title,back)+`<div class="card celebrate col" style="align-items:center"><div class="big">🎉</div><h2>Tiada kesilapan!</h2><p class="en">No mistakes to redo. Every wrong answer from quizzes will appear here.</p></div>`;return}
  let i=0;const answers=[];let state={};
  const draw=()=>{const q=qs[i];
    app.innerHTML=bar(esc(title),back,`<span class="pill">${i+1}/${qs.length}</span>`)+`<div class="col">${progressBar(i,qs.length)}
      ${mode==='exam'&&(i===0||qs[i-1].sec!==q.sec)?`<div class="sechead"><span>${SEC[q.sec].ico}</span><div><b>Bahagian ${String.fromCharCode(65+[...new Set(qs.map(x=>x.sec))].indexOf(q.sec))}: ${SEC[q.sec].nm}</b><div class="en">${SEC[q.sec].en}</div></div></div>`:''}
      ${qHTML(q,state)}<div id="qwhy">${state.chosen!==undefined&&mode==='practice'?whyHTML(q,state.chosen===q.a,true):''}</div>
      ${mode==='exam'?`<div class="row" style="justify-content:space-between">${i>0?'<button class="btn ghost" data-act="qprev">← Sebelum</button>':'<span></span>'}<button class="btn big" data-act="qnext" ${answers[i]===undefined?'disabled':''}>${i<qs.length-1?'Seterusnya →':'Hantar kertas ✓'}</button></div>`:''}
    </div>`;
    if(q.audio&&state.chosen===undefined)setTimeout(()=>V.speak(q.audio,0.8),250);
    if(state.chosen!==undefined){const w=document.getElementById('qwhy');if(w&&w.firstChild)w.scrollIntoView({block:'nearest',behavior:'smooth'})}};
  H.qplay=()=>V.speak(qs[i].audio,0.8);
  H.qans=async el=>{if(state.locked)return;const q=qs[i];const j=+el.dataset.j;
    if(mode==='exam'){answers[i]=j;app.querySelectorAll('.choice').forEach(b=>b.classList.toggle('sel',b===el));const nb=app.querySelector('[data-act=qnext]');if(nb)nb.disabled=false;if(q.opts[j].t)V.speak(q.opts[j].t,0.9);return}
    const ok=j===q.a;answers[i]=j;state={chosen:j,locked:true,openPassage:state.openPassage};logAnswer(q,ok);save();draw();
    if(ok)V.speak(pick(PRAISE));else{await V.speak('Jawapan yang betul ialah',0.9);V.speak(q.opts[q.a].t||q.opts[q.a].lab||'',0.8)}};
  H.qprev=()=>{if(i>0){i--;state={};draw();if(answers[i]!==undefined){const b=app.querySelectorAll('.choice')[answers[i]];if(b)b.classList.add('sel')}}};
  H.qnext=()=>{if(i<qs.length-1){i++;state={};draw();if(mode==='exam'&&answers[i]!==undefined){const b=app.querySelectorAll('.choice')[answers[i]];if(b)b.classList.add('sel')}}else results()};
  const results=()=>{if(mode==='exam')qs.forEach((q,k)=>logAnswer(q,answers[k]===q.a));
    const score=qs.filter((q,k)=>answers[k]===q.a).length;const secs={};qs.forEach((q,k)=>{const s=secs[q.sec]||(secs[q.sec]=[0,0]);s[1]++;if(answers[k]===q.a)s[0]++});
    S.tests.push({d:todayStr(),kind,unit:scopeU?scopeU.id:null,topic:c.id||null,score,total:qs.length,sec:secs});if(S.tests.length>100)S.tests=S.tests.slice(-100);
    if(kind==='harian')today().daily=true;markActive();save();
    const pct=Math.round(score/qs.length*100);const b=band(pct);const wrong=qs.map((q,k)=>[q,k]).filter(([q,k])=>answers[k]!==q.a);
    app.innerHTML=bar('Keputusan',back)+`<div class="col">
      <div class="card celebrate col" style="align-items:center;padding-block:20px"><div class="big">${b[2]}</div><h1>${score} / ${qs.length}</h1><p style="font-size:24px;font-weight:700">${pct}% · ${b[0]}</p><p class="en">${b[1]}. ${mode==='exam'?'Marked like a school paper: one mark per question.':''}</p></div>
      <div class="card col"><h2>Markah mengikut bahagian</h2><p class="en" style="margin-top:-8px">Marks by section</p>
        ${Object.entries(secs).map(([s,[r,t]])=>`<div class="skill"><span><b>${SEC[s].ico} ${SEC[s].nm}</b><br><span class="small muted">${SEC[s].en}</span></span>${progressBar(r,t)}<span class="small" style="font-variant-numeric:tabular-nums">${r}/${t}</span></div>`).join('')}</div>
      ${wrong.length?`<div class="card col"><h2>Semak jawapan</h2><p class="en" style="margin-top:-8px">Go through each mistake together. They are saved in "Kesilapan Saya" to redo later.</p>
        ${wrong.map(([q,k])=>`<div class="review col"><p><span class="secchip">${SEC[q.sec].ico} ${SEC[q.sec].nm}</span></p><p style="font-size:19px;font-weight:700">${esc(q.ask)}${q.sentence?' '+esc(q.sentence):''}${q.pic&&!q.big?' '+q.pic:''}</p>
          ${q.audio?`<p class="small">${say(q.audio,'sm')} Audio: <i>${esc(q.audio)}</i></p>`:''}
          <p class="small">Jawapan kamu: <span class="mw-miss">${esc(answers[k]===undefined?'(tiada)':(q.opts[answers[k]].t||q.opts[answers[k]].lab||q.opts[answers[k]].pic))}</span></p>${whyHTML(q,false,false)}</div>`).join('')}</div>`:''}
      <div class="row" style="justify-content:center">${wrong.length?`<button class="btn warm" data-act="go" data-to="quiz" data-p='{"kind":"kesilapan"}'>Ulang kesilapan 🔁</button>`:''}<button class="btn big" data-act="go" data-to="${back}">Selesai</button></div></div>`;
    V.speak(pct>=70?pick(PRAISE):'Teruskan berusaha!')};
  draw();
};

SCREENS.bacaan=()=>{let tab='vokal';
  const draw=()=>{app.innerHTML=bar('Asas Bacaan','home')+`<div class="col">
    <p class="en">Malay is read by joining syllables. Most syllables are a consonant + a vowel (ba, bi, bu), and words are made of syllables (bu + ku = buku). Tap to hear each sound.</p>
    <div class="row tabs">${[['vokal','Vokal'],['suku','Suku Kata'],['cantum','Cantum']].map(([k,t])=>`<button class="opt ${tab===k?'sel':''}" data-act="tab" data-k="${k}">${t}</button>`).join('')}</div>
    ${tab==='vokal'?`<div class="cards">${VOWELS.map(v=>`<button class="wcard" data-act="say" data-t="${v[0]}. ${esc(v[2].split(' ')[0])}" data-rate="0.6"><span class="w" style="font-size:54px">${v[0]}</span><span class="small">${esc(v[2])}</span><span class="en">${esc(v[1])}</span></button>`).join('')}</div>`
      :tab==='suku'?`<div class="sgrid-wrap"><table class="sgrid"><thead><tr><th></th>${'aeiou'.split('').map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${CONSONANTS.map(c=>`<tr><th>${c}</th>${'aeiou'.split('').map(v=>`<td><button data-act="say" data-t="${c+v}" data-rate="0.55">${c+v}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="en">Read across a row: ba, be, bi, bo, bu. Then try reading words: ba + ju = baju, bu + ku = buku.</p>`
      :`<div class="card col" style="align-items:center;gap:10px"><p style="font-size:20px"><b>Cantum suku kata!</b></p><p class="en">Blending game: hear a word and build it from syllables.</p><button class="btn big warm" data-act="startblend">Mula →</button></div>`}
  </div>`};
  H.tab=el=>{tab=el.dataset.k;draw()};
  H.startblend=()=>blendGame();
  draw();
};
function blendGame(){const words=shuffle(ALL_WORDS.filter(w=>!/\s|-/.test(w)&&WORDS[w].syl.length>=2&&WORDS[w].syl.length<=3)).slice(0,8);let i=0,right=0,slots=[],tiles=[],missed=false;const sylPool=[...new Set(ALL_WORDS.flatMap(w=>WORDS[w].syl))];
  const setup=()=>{const w=WORDS[words[i]];tiles=shuffle([...w.syl,...shuffle(sylPool.filter(s=>!w.syl.includes(s))).slice(0,3)].map((t,k)=>({t,k})));slots=[];missed=false};
  const draw=(state='')=>{const w=WORDS[words[i]];app.innerHTML=bar('Cantum Suku Kata','bacaan',`<span class="pill">${i+1}/${words.length}</span>`)+`<div class="col">${progressBar(i,words.length)}
    <div class="card col" style="align-items:center"><button class="btn audio big" data-act="say" data-t="${esc(w.ms)}">🔊 Dengar perkataan</button><p class="en">Listen, then tap the syllables in order.</p>${state==='ok'?`<span style="font-size:70px">${w.pic}</span>`:''}</div>
    <div class="slot ${state}" style="justify-content:center">${w.syl.map((_,j)=>`<span class="tile placed syl" style="min-width:80px;${slots[j]?'':'opacity:.35'}">${slots[j]?esc(slots[j].t):'?'}</span>`).join('')}</div>
    <div class="tiles">${tiles.map(tl=>`<button class="tile syl ${slots.includes(tl)?'used':''}" data-act="bslot" data-k="${tl.k}">${esc(tl.t)}</button>`).join('')}</div>
    ${state==='ok'?`<div class="row" style="justify-content:center"><b class="read">${esc(w.ms)}</b><button class="btn big" data-act="bnext">Seterusnya →</button></div>`:''}</div>`};
  H.bslot=async el=>{const w=WORDS[words[i]];const tl=tiles.find(t=>t.k==el.dataset.k);if(slots.includes(tl)||slots.length>=w.syl.length)return;slots.push(tl);V.speak(tl.t,0.6);
    if(slots.length===w.syl.length){if(slots.map(s=>s.t).join('')===w.ms){if(!missed)right++;draw('ok');await wait(300);V.speak(pick(PRAISE)+' '+w.ms,0.8)}else{missed=true;draw('bad');V.speak('Cuba lagi',0.9);setTimeout(()=>{slots=[];draw()},800)}}else draw()};
  H.bnext=()=>{i++;if(i<words.length){setup();draw();V.speak(WORDS[words[i]].ms,0.8)}else{markActive();save();app.innerHTML=bar('',null)+`<div class="card celebrate col" style="align-items:center"><div class="big">🔤</div><h1>${pick(PRAISE)}</h1><p style="font-size:22px">${right} / ${words.length}</p><p class="en">Blending syllables is the key P1 reading skill.</p><button class="btn big" data-act="go" data-to="bacaan">Selesai</button></div>`}};
  setup();draw();setTimeout(()=>V.speak(WORDS[words[0]].ms,0.8),300);
}

        <div class="row" style="justify-content:center"><button class="btn big warm" data-act="lstart">Mula ujian →</button></div></div></div>`;

    if(part==='bacaan'){app.innerHTML=bar('Lisan · Bacaan','latihan',`<span class="pill">${i+1}/${lines.length}</span>`)+`<div class="col">${progressBar(i,lines.length)}
      <div class="sechead"><span>🗣️</span><div><b>Bahagian 1: Bacaan Lantang</b><div class="en">Read each sentence aloud clearly.</div></div></div>
      <div class="card passage-read">${lines.map((l,j)=>`<p class="${j===i?'lit':''} ${j<i?'muted':''}">${esc(l)}</p>`).join('')}</div>
      ${micWidget(lines[i],{ask:'Baca ayat yang berwarna dengan kuat.',onNext:(st,r)=>{scores.bacaan.push(toStars(st,r));i++;if(i<lines.length)draw();else{part='perbualan';i=0;showModel=false;draw()}}}).html()}</div>`;return}
    if(part==='perbualan'){const q=convo[i];app.innerHTML=bar('Lisan · Perbualan','latihan',`<span class="pill">${i+1}/${convo.length}</span>`)+`<div class="col">${progressBar(i,convo.length)}
      <div class="sechead"><span>🖼️</span><div><b>Bahagian 2: Perbualan Berdasarkan Gambar</b><div class="en">Look at the picture and answer the teacher.</div></div></div>
      <div class="scene-wrap">${sceneSVG(sc,-1,[])}</div>
      <div class="card col"><div class="msg"><span class="av">🧕</span><div class="bub">${esc(q.q)}<div class="en">${esc(q.en)}</div></div>${say(q.q,'sm')}</div>
        ${showModel?'':`<p class="en">He answers aloud first, in a full sentence. Then tap to see a model answer.</p><div class="row" style="justify-content:center"><button class="btn warm big" data-act="lmodel">Saya sudah jawab → Lihat jawapan contoh</button></div>`}</div>
      ${showModel?`<div class="tip row">${say(q.model)}<span class="grow" style="font-size:22px;font-weight:700">${esc(q.model)}</span></div>${micWidget(q.model,{ask:'Sebut jawapan contoh ini.',onNext:(st,r)=>{scores.perbualan.push(toStars(st,r));i++;showModel=false;if(i<convo.length){draw();V.speak(convo[i].q,0.85)}else finishOral()}}).html()}`:''}</div>`;return}};
  H.lstart=()=>{part='bacaan';i=0;draw()};
  H.lmodel=()=>{showModel=true;draw();V.speak(convo[i].model,0.8)};
  const finishOral=()=>{const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;const b=avg(scores.bacaan),p=avg(scores.perbualan);
    const sec={bacaan:[Math.round(b*10)/10,3],perbualan:[Math.round(p*10)/10,3]};const total=Math.round((b+p)/6*20);
    S.tests.push({d:todayStr(),kind:'lisan',unit:u.id,score:total,total:20,sec});['bacaan','perbualan'].forEach(k=>{const s=S.sec[k]||(S.sec[k]={r:0,t:0});s.t+=3;s.r+=sec[k][0]});markActive();save();
    const pct=total*5;const bd=band(pct);
    app.innerHTML=bar('Keputusan Lisan','latihan')+`<div class="col"><div class="card celebrate col" style="align-items:center"><div class="big">${bd[2]}</div><h1>${total} / 20</h1><p style="font-size:22px;font-weight:700">${bd[0]}</p>
      <div class="col" style="align-self:stretch;gap:10px">${[['bacaan',b],['perbualan',p]].map(([k,v])=>`<div class="skill"><span><b>${SEC[k].ico} ${SEC[k].nm}</b></span>${progressBar(v,3)}<span class="small">${v.toFixed(1)} ★</span></div>`).join('')}</div>
      <p class="en">Average stars per sentence, converted to a mark out of 20. To improve the picture conversation, practise answering in full sentences: who, doing what, where.</p>
      <div class="row" style="justify-content:center"><button class="btn ghost" data-act="go" data-to="lisan" data-p='{"unit":"${u.id}"}'>Cuba lagi</button><button class="btn big" data-act="go" data-to="latihan">Selesai</button></div></div></div>`;V.speak(pick(PRAISE))};
  draw();
};

/* ---------- parent: assessment summary card ---------- */
function parentAssessmentCard(){const t=S.tests.slice(-8).reverse();const secs=Object.keys(SEC).filter(k=>S.sec[k]&&S.sec[k].t);
  const gram=GRAMMAR.filter(g=>S.gram[g.id]&&S.gram[g.id].t);const nM=Object.keys(S.mistakes).length;
  return `<div class="card col"><h2>Assessment results</h2>
    ${t.length?`<div class="col" style="gap:6px">${t.map(x=>`<div class="row hist"><span class="grow"><b>${esc(testName(x))}</b> <span class="small muted">${esc(x.d)}</span></span><span class="pill">${x.score}/${x.total} · ${Math.round(x.score/x.total*100)}%</span></div>`).join('')}</div>`:'<p class="small muted">No quizzes or papers yet. Start from Latihan & Ujian, or the Kuiz at the end of each unit.</p>'}
    ${secs.length?`<h3>Accuracy by exam component</h3>${secs.map(k=>{const s=S.sec[k];const pc=Math.round(s.r/s.t*100);return `<div class="skill"><span><b>${SEC[k].nm}</b><br><span class="small muted">${SEC[k].en}</span></span>${progressBar(s.r,s.t)}<span class="small">${pc}%</span></div>`}).join('')}
      <p class="small muted">The lowest bars are where to focus. The oral parts are an average of stars.</p>`:''}
    ${gram.length?`<h3>Grammar</h3><div class="row">${gram.map(g=>{const s=S.gram[g.id];return `<span class="opt">${g.pic} ${esc(g.nm)} · ${Math.round(s.r/s.t*100)}%</span>`}).join('')}</div>`:''}
    ${nM?`<p class="small">🔁 <b>${nM}</b> wrong answers are waiting in <b>Kesilapan Saya</b>. Each one clears after he gets it right twice.</p>`:''}</div>`}
</script>
