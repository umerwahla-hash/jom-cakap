<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Jom Cakap">
<meta name="theme-color" content="#23764A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Jom Cakap</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: one-screen iPad app. A top bar, then one focused "card table" per activity. Ketupat-weave texture marks the home ground. */
:root{
  --bg:#EEF4EA;          /* pale pandan paper */
  --card:#FFFFFF;
  --ink:#1D2B22;
  --muted:#5D6E62;
  --line:#D5E0D2;
  --pandan:#23764A;      /* primary */
  --pandan-soft:#DCEFE2;
  --kunyit:#F0AE2E;      /* turmeric: stars, rewards */
  --kunyit-soft:#FCEFD0;
  --songket:#962A47;     /* maroon: headings accent, errors */
  --songket-soft:#F6DDE3;
  --sky:#2F73B5;         /* audio */
  --sky-soft:#DDEAF7;
  --weave1:rgba(35,118,74,.06);
  --weave2:rgba(240,174,46,.08);
  --shadow:0 2px 0 rgba(29,43,34,.08), 0 8px 24px rgba(29,43,34,.06);
  --f-display:"Grandstander","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --f-read:"Andika","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111915;--card:#1B2620;--ink:#E8F1EA;--muted:#9DB1A3;--line:#2C3B32;
  --pandan:#5CC089;--pandan-soft:#1F3A2B;--kunyit:#F4C15A;--kunyit-soft:#3A3018;
  --songket:#EC7E98;--songket-soft:#3E2029;--sky:#7DB5EA;--sky-soft:#1C3046;
  --weave1:rgba(92,192,137,.035);--weave2:rgba(244,193,90,.03);
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111915;--card:#1B2620;--ink:#E8F1EA;--muted:#9DB1A3;--line:#2C3B32;
  --pandan:#5CC089;--pandan-soft:#1F3A2B;--kunyit:#F4C15A;--kunyit-soft:#3A3018;
  --songket:#EC7E98;--songket-soft:#3E2029;--sky:#7DB5EA;--sky-soft:#1C3046;
  --weave1:rgba(92,192,137,.035);--weave2:rgba(244,193,90,.03);
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);color-scheme:dark}

html,body{height:100%}\nbody{margin:0}\n[hidden]{display:none!important}\nimg{max-width:100%}\n:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-read);font-size:18px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body.home{background-image:
  repeating-linear-gradient(45deg,var(--weave1) 0 14px,transparent 14px 28px),
  repeating-linear-gradient(-45deg,var(--weave2) 0 14px,transparent 14px 28px)}
#app{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;min-height:100%;box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(28px,4.4vw,40px)}
h2{font-size:clamp(22px,3.2vw,30px)}
h3{font-size:20px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.en{color:var(--muted);font-size:15px;font-style:italic}
body:not(.show-en) .en{display:none}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.bar .title{font-family:var(--f-display);font-weight:800;font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:52px;height:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:24px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--kunyit-soft);font-weight:700;font-variant-numeric:tabular-nums}
.toggle-en{font-family:var(--f-display);font-weight:800;font-size:16px}
body.show-en .toggle-en{background:var(--sky);color:#fff}

/* surfaces */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.btn{min-height:56px;padding:0 22px;border-radius:16px;font-family:var(--f-display);font-weight:800;font-size:20px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--pandan);color:#fff;
  box-shadow:0 4px 0 color-mix(in srgb,var(--pandan) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--pandan) 60%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.audio{background:var(--sky);box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.btn.warm{background:var(--kunyit);color:#2a1d00;box-shadow:0 4px 0 color-mix(in srgb,var(--kunyit) 60%,#000)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{min-height:68px;font-size:24px;padding:0 30px}
.say{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--sky);color:#fff;font-size:22px;flex:none;box-shadow:0 3px 0 color-mix(in srgb,var(--sky) 60%,#000)}
.say.sm{width:40px;height:40px;font-size:17px}
.say.playing{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.greet small{display:block;font-family:var(--f-read);font-weight:400;font-size:16px;color:var(--muted)}
.mission{border:3px solid var(--kunyit);background:linear-gradient(var(--card),var(--card)) padding-box}
.mission ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mission li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg)}
.mission li.done{opacity:.55}
.mission .tick{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-weight:800;flex:none;font-family:var(--f-display)}
.mission li.done .tick{background:var(--pandan);color:#fff}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.unit{position:relative;text-align:left;padding:14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);min-height:118px;display:flex;flex-direction:column;gap:6px}
.unit .num{font-family:var(--f-display);font-weight:800;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.unit .nm{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.15}
.unit .pic{font-size:30px;line-height:1}
.unit.locked{opacity:.5;box-shadow:none;background:transparent;border:2px dashed var(--line)}
.unit.open{outline:3px solid var(--pandan);outline-offset:-3px}
.unit .term{position:absolute;top:10px;right:12px;font-size:12px;color:var(--muted);font-weight:700}

/* unit ladder */
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.rung{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.rung .ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--pandan-soft);flex:none}
.rung .step{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.rung .nm{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1}
.rung.next{outline:3px solid var(--kunyit);outline-offset:-3px}
.stars{color:var(--kunyit);letter-spacing:2px;font-size:18px}
.stars .off{color:var(--line)}
.arc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.arc b{color:var(--ink)}

/* word cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.wcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative}
.wcard .pic{font-size:64px;line-height:1.1}
.wcard .w{font-family:var(--f-read);font-weight:700;font-size:26px}
.wcard .syl{font-size:18px;color:var(--songket);font-weight:700;letter-spacing:.02em}
.wcard.seen::after{content:"✓";position:absolute;top:8px;right:12px;color:var(--pandan);font-weight:800}
.wcard.playing{outline:3px solid var(--sky)}

/* quiz */
.prompt{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap;text-align:center}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:700px){.choices.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.choice{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:120px;justify-content:center;font-size:22px;font-weight:700}
.choice .pic{font-size:60px;line-height:1}
.choice.right{background:var(--pandan-soft);outline:3px solid var(--pandan)}
.choice.wrong{background:var(--songket-soft);outline:3px solid var(--songket);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.progress{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--pandan);border-radius:999px;transition:width .3s}

/* big reading text */
.read{font-family:var(--f-read);font-size:clamp(28px,4.6vw,42px);line-height:1.35;font-weight:700}
.sylrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sylrow button{font-family:var(--f-read);font-weight:700;font-size:clamp(30px,5vw,46px);padding:6px 16px;border-radius:16px;background:var(--sky-soft);color:var(--ink);min-width:72px}
.sylrow button.lit{background:var(--sky);color:#fff}
.tip{background:var(--kunyit-soft);border-radius:14px;padding:12px 14px;font-size:16px}
.tip b{font-family:var(--f-display)}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.faces button{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:17px}
.faces button span{font-size:44px;line-height:1.1}

/* tiles */
.slot{min-height:84px;border-radius:18px;border:3px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg)}
.slot.ok{border:3px solid var(--pandan);background:var(--pandan-soft)}
.slot.bad{border-color:var(--songket);animation:shake .35s}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{font-family:var(--f-read);font-weight:700;font-size:clamp(24px,3.6vw,32px);padding:10px 18px;border-radius:14px;background:var(--card);
  box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line);min-height:60px}
.tile.used{visibility:hidden}
.tile.placed{background:var(--kunyit-soft);box-shadow:0 3px 0 color-mix(in srgb,var(--kunyit) 50%,transparent)}
.tile.syl{color:var(--songket)}

/* scene */
.scene-wrap{border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.scene-wrap svg{display:block;width:100%;height:auto}
.scene-wrap .who{cursor:pointer}
.scene-wrap .who .halo{fill:transparent;stroke:transparent;stroke-width:5}
.scene-wrap .who.active .halo{stroke:var(--kunyit);fill:color-mix(in srgb,var(--kunyit) 20%,transparent)}
.scene-wrap .who.done .halo{stroke:var(--pandan)}
.wheel{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.wq h3{display:flex;gap:8px;align-items:center;font-size:18px;margin-bottom:8px}
.wq .opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:14px;background:var(--bg);font-weight:700;font-size:19px;box-shadow:inset 0 0 0 2px var(--line);min-height:52px;display:inline-flex;align-items:center;gap:8px}
.opt.sel{background:var(--pandan);color:#fff;box-shadow:none}
.opt.bad{background:var(--songket-soft);box-shadow:inset 0 0 0 2px var(--songket);animation:shake .35s}
.story p{font-size:clamp(22px,3.2vw,28px);font-weight:700;line-height:1.45;padding:6px 10px;border-radius:12px}
.story p.lit{background:var(--kunyit-soft)}
.story .lbl{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--songket);margin-top:6px}
.story.hidden-text p .t{filter:blur(9px)}
.word{border-radius:8px;padding:0 2px}
.word:active,.word.lit{background:var(--sky-soft)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.msg .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--pandan-soft);flex:none}
.msg .bub{background:var(--card);box-shadow:var(--shadow);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:22px;font-weight:700;min-width:0}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--kunyit-soft);border-radius:18px 18px 4px 18px}
.msg.me .av{background:var(--kunyit-soft)}
.fix{margin-top:8px;font-size:16px;font-weight:400;background:var(--sky-soft);border-radius:12px;padding:8px 10px}
.answers{display:flex;flex-wrap:wrap;gap:10px}
textarea,input[type=text],input[type=number],select{font:inherit;font-size:20px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
textarea{min-height:96px;resize:vertical}

/* book */
.book{background:var(--card);border-radius:8px 22px 22px 8px;box-shadow:var(--shadow);padding:26px 26px 26px 34px;position:relative;
  background-image:repeating-linear-gradient(transparent 0 47px,var(--line) 47px 49px);background-position:0 18px}
.book::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:3px;background:var(--songket-soft)}
.book h2{color:var(--songket);margin-bottom:10px}
.book p{font-size:clamp(22px,3.2vw,28px);line-height:49px;font-weight:700}

/* celebration */
.celebrate{text-align:center;padding-block:30px}
.celebrate .big{font-size:96px;line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.celebrate .stars{font-size:54px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* parent */
.skill{display:grid;grid-template-columns:150px 1fr 48px;gap:12px;align-items:center}
.skill .progress{height:14px}
.skill .progress i{background:var(--kunyit)}
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fam .fm{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:8px 10px;font-weight:700}
.fam input{width:64px;padding:6px 8px;font-size:18px}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);font-weight:800}
.stepper output{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.notice{border-left:5px solid var(--songket);background:var(--songket-soft);border-radius:12px;padding:12px 14px;font-size:16px}
.ok-note{border-left:5px solid var(--pandan);background:var(--pandan-soft);border-radius:12px;padding:12px 14px;font-size:16px}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:19px;padding:6px 0}
ul.tips{margin:0;padding-left:20px;display:grid;gap:8px}
.journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.journey div{background:var(--bg);border-radius:14px;padding:12px}
.journey b{font-family:var(--f-display);display:block;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:9;max-width:calc(100% - 32px)}
/* speak & score */
.micbox{align-items:stretch}
.card .micbox,.card.micbox .micbox{box-shadow:none}
.card .card.micbox{background:var(--bg);box-shadow:none}
.mw-center{display:flex;flex-direction:column;align-items:center;gap:8px}
.mic{width:116px;height:116px;border-radius:50%;background:var(--songket);color:#fff;font-size:52px;display:grid;place-items:center;
  box-shadow:0 6px 0 color-mix(in srgb,var(--songket) 55%,#000)}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--songket) 55%,#000)}
.mic.on{background:var(--pandan);box-shadow:0 0 0 0 color-mix(in srgb,var(--pandan) 50%,transparent);animation:ring 1.2s infinite}
.mic.on span{font-size:40px}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pandan) 45%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
.mw-hint{text-align:center;font-size:18px}
.mw-words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:clamp(24px,4vw,34px);font-weight:700}
.mw-words span{padding:2px 10px;border-radius:10px}
.mw-ok{background:var(--pandan-soft);color:var(--pandan)}
.mw-near{background:var(--kunyit-soft);color:color-mix(in srgb,var(--kunyit) 55%,var(--ink))}
.mw-miss{background:var(--songket-soft);color:var(--songket);text-decoration:underline wavy}
label.btn{cursor:pointer}

/* hubs, units, assessment */
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.hub{text-align:left;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:4px}
.hub b{font-family:var(--f-display);font-size:20px}
.hub-ico{font-size:34px;line-height:1}
.warnhub{outline:3px solid var(--songket);outline-offset:-3px}
.minibar{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}
.minibar i{display:block;height:100%;background:var(--pandan)}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ug{display:grid;grid-template-columns:28px 1fr;gap:2px 8px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 10px}
.ug .minibar,.ug .muted{grid-column:2}
.secchip{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:99px;background:var(--sky-soft);color:var(--ink)}
.qsent{text-align:center;font-size:clamp(24px,4vw,34px)!important}
.choice.txt{min-height:64px;font-size:21px;flex-direction:row;justify-content:flex-start;text-align:left;padding:14px 18px}
.choice.sel{outline:3px solid var(--sky);background:var(--sky-soft)}
.choice .small{font-size:15px;color:var(--muted)}
.explain{border-left:6px solid var(--songket);background:var(--songket-soft);border-radius:14px;padding:14px 16px}
.ok-note.col{border-left-width:6px}
.whyline{font-size:17px}
.review{border-top:1px solid var(--line);padding-top:12px;gap:8px}
.sechead{display:flex;gap:12px;align-items:center;background:var(--kunyit-soft);border-radius:14px;padding:10px 14px}
.sechead>span{font-size:30px}
.gtable{display:grid;gap:6px}
.grow-row{display:grid;grid-template-columns:36px 44px auto 1fr;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:6px 10px}
.grow-row .say{width:36px;height:36px;font-size:15px}
.sgrid-wrap{overflow-x:auto}
.sgrid{border-collapse:separate;border-spacing:6px;margin:0 auto}
.sgrid th{font-family:var(--f-display);font-size:20px;color:var(--songket);padding:4px 8px}
.sgrid td button{min-width:62px;min-height:52px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:22px}
.passage-read p{font-size:clamp(22px,3.4vw,28px);font-weight:700;padding:6px 10px;border-radius:10px;margin:0}
.passage-read p.lit{background:var(--kunyit-soft)}
.hist{padding:6px 0;border-bottom:1px solid var(--line)}
.passage summary{font-size:17px}
@media (max-width:560px){.grow-row{grid-template-columns:30px 40px 1fr}.grow-row .muted{grid-column:3}}
@media (max-width:560px){
  .hero{grid-template-columns:1fr}
  .skill{grid-template-columns:110px 1fr 40px}
  .choice .pic{font-size:48px}
  .mission li{flex-wrap:wrap}
  .mission li .btn{width:100%}
  .bar .title{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const GRAMMAR_BY_ID=Object.fromEntries(GRAMMAR.map(g=>[g.id,g]));

/* Asas Bacaan — vowels and consonant+vowel syllables (P1 reading is built syllable by syllable) */
const VOWELS=[['a','a, as in "ah"','ayam 🐔'],['e','two sounds: soft "ə" in emak, or "é" in enak','emak 👩'],['i','i, as in "see"','ikan 🐟'],['o','o, as in "or"','oren 🍊'],['u','u, as in "moon"','ular 🐍']];
const CONSONANTS=['b','c','d','g','h','j','k','l','m','n','p','r','s','t','w','y'];
/* =========================================================
   LISTEN & SCORE — on-device speech recognition + recording
   ========================================================= */
const IN_CLAUDE=!!(window.claude&&window.claude.use);

/* Azure pronunciation scoring: the parent pastes the helper's address in the
   Parent corner (kept on this device only, never in the public code).
   Expected reply: {stars:0-3, words:[{w, status:"ok"|"near"|"miss", score}], heard, scores:{pron,accuracy,fluency,completeness}} */
const PRON_CONFIG={get azureUrl(){return (typeof S!=='undefined'&&S.settings&&S.settings.azureUrl)||''}};

/* ---------- pure scoring (no browser APIs; unit-tested) ---------- */
const NUM_MS={0:'kosong',1:'satu',2:'dua',3:'tiga',4:'empat',5:'lima',6:'enam',7:'tujuh',8:'lapan',9:'sembilan',10:'sepuluh',11:'sebelas',12:'dua belas'};
function normWords(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/(\d+)/g,m=>' '+(NUM_MS[+m]||m)+' ').replace(/-/g,' ').replace(/[^a-z0-9\s]/g,' ')
    .split(/\s+/).filter(Boolean);
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function wordSim(a,b){if(a===b)return 1;return 1-lev(a,b)/Math.max(a.length,b.length)}
const credit=s=>s>=0.85?1:s>=0.6?0.5:0;
/* Align target words to heard words in order (DP), so extra or missing words
   don't shift everything. Returns per-target-word status. */
function alignScore(target,heard){
  const t=normWords(target),h=normWords(heard);const m=t.length,n=h.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]+credit(wordSim(t[i-1],h[j-1])));
  const words=t.map(w=>({w,status:'miss'}));let i=m,j=n;
  while(i>0&&j>0){const c=credit(wordSim(t[i-1],h[j-1]));
    if(c>0&&dp[i][j]===dp[i-1][j-1]+c){words[i-1].status=c===1?'ok':'near';i--;j--}
    else if(dp[i][j]===dp[i-1][j])i--;else j--}
  const score=m?dp[m][n]/m:0;
  // penalise lots of extra words only slightly (children add "um", repeats)
  return {score,words,heard:h.join(' ')};
}
function scoreAttempt(target,alts){
  let best={score:0,words:normWords(target).map(w=>({w,status:'miss'})),heard:''};
  for(const a of (alts||[])){const r=alignScore(target,a);if(r.score>best.score)best=r}
  // One-word targets: recognisers often spell short words differently (adek/adik), so 'nearly' earns 2 stars.
  if(best.words.length===1&&best.words[0].status==='near')best.score=0.75;
  const s=best.score;best.stars=s>=0.9?3:s>=0.7?2:s>=0.4?1:0;return best;
}

/* ---------- microphone ---------- */
const Mic={
  Rec:window.SpeechRecognition||window.webkitSpeechRecognition||null,
  recBroken:false,recorderBroken:false,conflict:false,lastError:'',
  active:null,
  get recorderOK(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)&&!this.recorderBroken},
  get recogOK(){return !!this.Rec&&!this.recBroken},
  mode(){return (S.settings&&S.settings.micMode)||'auto'}, // auto | recog | record | off
  wantsRecog(){const m=this.mode();return (m==='auto'||m==='recog')&&this.recogOK},
  wantsRecord(){const m=this.mode();return (m==='auto'&&!this.conflict||m==='record')&&this.recorderOK},
  available(){return this.mode()!=='off'&&(this.wantsRecog()||this.wantsRecord()||!!PRON_CONFIG.azureUrl&&this.recorderOK)},
  canScore(){return this.wantsRecog()||(!!PRON_CONFIG.azureUrl&&this.recorderOK)},
  stop(){if(this.active)this.active.stop()},
  /* Listen once. Resolves {alts, url, blob, noSpeech, error} */
  listen(target){
    return new Promise(async resolve=>{
      const out={alts:[],url:null,blob:null,noSpeech:false,error:''};
      let stream=null,recorder=null,chunks=[],rec=null,finished=false,recDone=!this.wantsRecog(),recorderDone=true;
      const words=normWords(target).length;const maxMs=Math.min(14000,3500+words*900);
      const finish=()=>{if(finished)return;if(!recDone||!recorderDone)return;finished=true;clearTimeout(timer);this.active=null;
        if(stream)stream.getTracks().forEach(t=>t.stop());
        if(chunks.length){out.blob=new Blob(chunks,{type:(recorder&&recorder.mimeType)||'audio/mp4'});out.url=URL.createObjectURL(out.blob)}
        resolve(out)};
      const stopAll=()=>{try{rec&&rec.stop()}catch(e){}try{recorder&&recorder.state!=='inactive'&&recorder.stop()}catch(e){}
        if(!rec)recDone=true;if(!recorder)recorderDone=true;finish()};
      this.active={stop:stopAll};
      const timer=setTimeout(stopAll,maxMs);
      if(this.wantsRecord()||(PRON_CONFIG.azureUrl&&this.recorderOK)){
        try{stream=await navigator.mediaDevices.getUserMedia({audio:true});
          recorder=new MediaRecorder(stream);recorderDone=false;
          recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
          recorder.onstop=()=>{recorderDone=true;finish()};recorder.start()}
        catch(e){this.recorderBroken=true;out.error=out.error||'recorder:'+(e.name||e);recorder=null;recorderDone=true}}
      if(this.wantsRecog()){
        try{rec=new this.Rec();rec.lang='ms-MY';rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
          rec.onresult=e=>{for(const r of e.results)for(let k=0;k<r.length;k++)out.alts.push(r[k].transcript)};
          rec.onerror=e=>{const er=e.error||'error';if(er!=='no-speech')this.lastError=er;
            if(er==='no-speech')out.noSpeech=true;
            else if(er==='not-allowed'||er==='service-not-allowed'||er==='language-not-supported'){this.recBroken=true;out.error=er}
            else if(er==='audio-capture'&&recorder){this.conflict=true;out.error=er}
            else out.error=er};
          rec.onend=()=>{recDone=true;try{recorder&&recorder.state!=='inactive'&&recorder.stop()}catch(e){}finish()};
          rec.start()}
        catch(e){this.recBroken=true;out.error='recog:'+(e.name||e);recDone=true;rec=null}}
      else recDone=true;
      if(!rec&&!recorder){this.active=null;clearTimeout(timer);out.error=out.error||'unavailable';resolve(out)}
    });
  }
};

/* Optional server-side scoring (Azure helper), used when PRON_CONFIG.azureUrl is set */
/* Convert any recording Safari makes (mp4/aac) to 16 kHz mono 16-bit WAV, the format Azure's short-audio API wants */
async function toWav16k(blob){
  const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();
  try{const buf=await new Promise((res,rej)=>{blob.arrayBuffer().then(ab=>{const p=ac.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)},rej)});
    const rate=16000,len=Math.max(1,Math.ceil(buf.duration*rate));
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const oc=new OAC(1,len,rate);
    const src=oc.createBufferSource();src.buffer=buf;src.connect(oc.destination);src.start(0);
    const out=await new Promise((res,rej)=>{const p=oc.startRendering();if(p&&p.then)p.then(res,rej);else oc.oncomplete=e=>res(e.renderedBuffer)});
    const d=out.getChannelData(0);const ab=new ArrayBuffer(44+d.length*2);const v=new DataView(ab);
    const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+d.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);
    for(let i=0;i<d.length;i++){const x=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true)}
    return new Blob([ab],{type:'audio/wav'});
  }finally{try{ac.close()}catch(e){}}
}
async function remoteScore(target,blob){
  const wav=await toWav16k(blob);const base=PRON_CONFIG.azureUrl;
  const url=base+(base.includes('?')?'&':'?')+'text='+encodeURIComponent(target)+'&lang=ms-MY';
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),15000);
  try{const r=await fetch(url,{method:'POST',body:wav,headers:{'Content-Type':'audio/wav'},signal:ctl.signal});
    if(!r.ok)throw new Error('score '+r.status);const j=await r.json();if(j.error)throw new Error(j.error);
    return {stars:Math.max(0,Math.min(3,+j.stars||0)),words:Array.isArray(j.words)&&j.words.length?j.words:normWords(target).map(w=>({w,status:'miss'})),
      heard:String(j.heard||''),scores:j.scores||null,score:(+j.stars||0)/3,azure:true};
  }finally{clearTimeout(t)}
}

/* ---------- stats ---------- */
function logPron(target,res){
  if(!S.pron)S.pron={log:[],words:{}};
  S.pron.log.push({t:target,s:res.stars,d:todayStr()});if(S.pron.log.length>200)S.pron.log=S.pron.log.slice(-200);
  for(const w of res.words){const r=S.pron.words[w.w]||(S.pron.words[w.w]={ok:0,near:0,miss:0});r[w.status]++;
    if(WORDS[w.w])hit(w.w,w.status==='ok')}
}
function trickySounds(){if(!S.pron)return[];return Object.entries(S.pron.words).filter(([w,r])=>(r.near+r.miss)>=1&&(r.near+r.miss)>=r.ok*0.5)
  .sort((a,b)=>(b[1].near+b[1].miss-b[1].ok)-(a[1].near+a[1].miss-a[1].ok)).map(([w])=>w)}

/* ---------- the "speak & score" widget used by every speaking step ---------- */
function micWidget(target,{onNext,nextLabel='Seterusnya →',ask='Giliran kamu! Tekan dan cakap.'}={}){
  const st={phase:'idle',res:null,tries:0,url:null,msg:''};let audio=null;
  const box=()=>document.getElementById('micbox');
  const wordsHtml=res=>`<div class="mw-words">${res.words.map(x=>`<span class="mw-${x.status}">${esc(x.w)}</span>`).join(' ')}</div>`;
  const fallback=()=>`<h2 style="text-align:center">${ask.replace('Tekan dan cakap.','Sebut dengan kuat.')}</h2>
    <p class="en" style="text-align:center">${Mic.mode()==='off'?'Listening is switched off in the Parent corner.':IN_CLAUDE?'Listening works in the standalone (GitHub) version; inside Claude the microphone is blocked.':'This device can\'t listen here.'} Say it out loud, then pick a face.</p>
    <div class="faces"><button data-act="mrate" data-v="2"><span>😀</span>Senang</button><button data-act="mrate" data-v="1"><span>🙂</span>Boleh</button><button data-act="mrate" data-v="0"><span>😕</span>Susah</button></div>`;
  const inner=()=>{
    if(!Mic.available())return fallback();
    if(st.phase==='scoring')return `<h2 style="text-align:center">${ask}</h2><div class="mw-center"><div class="mic on" aria-hidden="true"><span>⏳</span></div><p class="mw-hint"><b>Cikgu sedang menyemak…</b></p></div>`;
    const micBtn=st.phase==='listening'
      ?`<button class="mic on" data-act="mic" aria-label="Berhenti"><span>●</span></button><p class="mw-hint"><b>Saya sedang mendengar…</b><br><span class="small muted">Tekan sekali lagi bila sudah habis.</span></p>`
      :`<button class="mic" data-act="mic" aria-label="Tekan dan cakap"><span>🎤</span></button><p class="mw-hint"><b>${st.tries?'Cuba lagi':'Tekan dan cakap'}</b></p>`;
    let result='';
    if(st.phase==='result'){const r=st.res;
      if(r&&r.scored){
        const near=r.words.filter(w=>w.status!=='ok').map(w=>w.w);
        result=`<div class="mw-result col" style="gap:8px;align-items:center">${starStr(r.stars)}${wordsHtml(r)}
          <p style="font-size:20px;font-weight:700;text-align:center">${esc(st.msg)}</p>
          ${r.heard?`<p class="small muted">Saya dengar: “${esc(r.heard)}”</p>`:''}
          ${r.scores?`<p class="small muted" style="text-align:center">Sebutan ${Math.round(r.scores.pron||0)} · Ketepatan ${Math.round(r.scores.accuracy||0)} · Kelancaran ${Math.round(r.scores.fluency||0)} · Kelengkapan ${Math.round(r.scores.completeness||0)} <span class="en">(Azure scores out of 100: overall, accuracy, fluency, completeness)</span></p>`:''}
          ${near.length&&r.stars<3?`<div class="row" style="justify-content:center">${near.slice(0,3).map(w=>`<span class="opt">${say(w,'sm',0.6)} ${esc(w)}</span>`).join('')}</div>`:''}
          <p class="en">${r.azure?'Green = well pronounced, amber = nearly, red = needs work or skipped. Scored by Azure pronunciation assessment.':'Green = clear, amber = nearly, red = not heard. The iPad checks whether it understood him; it can\'t judge accent precisely.'}</p></div>`}
      else if(r&&r.noSpeech){result=`<div class="tip" style="text-align:center">Saya tak dengar apa-apa. Cakap lebih kuat dan dekat dengan iPad. <span class="en">Nothing was heard. Speak louder and closer.</span></div>`}
      else{result=`<div class="col" style="gap:8px;align-items:center"><p style="font-size:20px;font-weight:700">Dengar suara kamu, kemudian dengar contoh. Sama?</p><p class="en">Recording only (no automatic scoring on this device). Compare his voice with the model, then pick a face.</p>
        <div class="faces" style="align-self:stretch"><button data-act="mrate" data-v="2"><span>😀</span>Sama!</button><button data-act="mrate" data-v="1"><span>🙂</span>Hampir</button><button data-act="mrate" data-v="0"><span>😕</span>Belum</button></div></div>`}}
    const playRow=st.phase==='result'?`<div class="row" style="justify-content:center">${st.url?`<button class="btn ghost" data-act="mplay">▶ Suara saya</button>`:''}<button class="btn audio" data-act="say" data-t="${esc(target)}">🔊 Contoh</button></div>`:'';
    const nextBtn=st.phase==='result'&&(st.res&&(st.res.scored||st.res.noSpeech))||st.tries>=3&&st.phase!=='listening'
      ?`<div class="row" style="justify-content:center">${st.res&&st.res.scored&&st.res.stars>=2?`<button class="btn big" data-act="mnext">${nextLabel}</button>`:`<button class="btn ghost" data-act="mnext">Langkau →</button>`}</div>`:'';
    return `<h2 style="text-align:center">${ask}</h2><div class="mw-center">${micBtn}</div>${result}${playRow}${nextBtn}`};
  const render=()=>{const b=box();if(b)b.innerHTML=inner()};
  H.mic=async()=>{
    if(st.phase==='listening'){Mic.stop();return}
    V.stop();if(audio){audio.pause();audio=null}
    st.phase='listening';render();
    const r=await Mic.listen(target);
    if(st.url)URL.revokeObjectURL(st.url);st.url=r.url;st.tries++;
    let res=null;
    if(PRON_CONFIG.azureUrl&&r.blob){st.phase='scoring';render();try{res=await remoteScore(target,r.blob);res.scored=true;Mic.azureError=''}catch(e){Mic.azureError=String(e.message||e)}}
    if(!res&&r.alts.length){res=scoreAttempt(target,r.alts);res.scored=true}
    if(!res&&r.noSpeech&&Mic.wantsRecog())res={noSpeech:true};
    if(!res&&!r.url&&!Mic.available()){st.phase='idle';render();toast('Mic unavailable — switching to faces.');return}
    if(!res)res={scored:false};

      st.msg=res.stars===3?pick(['Hebat! Sebutan kamu jelas.','Syabas! Sangat jelas.','Pandai! Teruskan!']):res.stars===2?'Bagus! Hampir sempurna.':res.stars===1?'Cuba lagi. Dengar contoh dahulu.':'Mari cuba sekali lagi, perlahan-lahan.'}
    render();
    if(res.scored)V.speak(res.stars>=2?st.msg.split('!')[0]+'!':'Cuba lagi.',0.9);
  };
  H.mplay=()=>{if(!st.url)return;V.stop();audio=new Audio(st.url);audio.play().catch(()=>toast('Could not play the recording.'))};
  H.mnext=()=>{if(audio)audio.pause();onNext&&onNext(st.res&&st.res.scored?st.res.stars:null,null)};
  H.mrate=el=>{if(audio)audio.pause();onNext&&onNext(null,+el.dataset.v)};
  return {html:()=>`<div id="micbox" class="card col micbox">${inner()}</div>`};
}

const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pick=a=>a[Math.random()*a.length|0];

const ALL_WORDS=Object.keys(WORDS);
function tipFor(w){const W=WORDS[w];if(W&&W.tip)return W.tip;
  if(/ng/.test(w))return '"ng" is one soft sound, like the end of "sing", with no hard g.';
  if(/ny/.test(w))return '"ny" sounds like the ny in "canyon".';
  if(/c/.test(w))return 'Malay "c" sounds like "ch" in "chair".';
  if(/k$/.test(w))return 'A final k is a soft stop in the throat, not a strong English k.';
  if(/^(me|ke|be|pe|se|te)/.test(w))return 'The first "e" is short and soft, like the a in "about".';
  if(/r/.test(w))return 'Tap the "r" lightly with the tip of the tongue.';
  return 'Every syllable gets an even beat. Vowels are pure: a = "ah", i = "ee", u = "oo".'}

function hit(w,ok){if(!w||!WORDS[w])return;const r=S.words[w]||(S.words[w]={ok:0,miss:0});ok?r.ok++:r.miss++}
function weakWords(){return Object.entries(S.words).filter(([w,r])=>WORDS[w]&&r.miss>0&&r.miss*2>=r.ok).sort((a,b)=>(b[1].miss-b[1].ok)-(a[1].miss-a[1].ok)).map(([w])=>w)}

const V={voice:null,kind:'none',
  init(){const has='speechSynthesis' in window;const pickV=()=>{if(!has)return;const vs=speechSynthesis.getVoices();const ms=vs.filter(v=>/^ms([-_]|$)/i.test(v.lang));const id=vs.filter(v=>/^(id|in)([-_]|$)/i.test(v.lang));
      this.voice=ms.find(v=>/amira/i.test(v.name))||ms[0]||id[0]||null;this.kind=ms.length?'ms':id.length?'id':'none'};
    pickV();if(has&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',pickV)},
  stop(){try{if('speechSynthesis' in window&&(speechSynthesis.speaking||speechSynthesis.pending))speechSynthesis.cancel()}catch(e){}},
  speak(text,rate=0.85){return new Promise(res=>{if(!('speechSynthesis' in window)||!text)return res();this.stop();
    const u=new SpeechSynthesisUtterance(text);u.lang=this.voice?this.voice.lang:'ms-MY';if(this.voice)u.voice=this.voice;u.rate=rate;
    let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,1800+text.length*120/rate);
    try{speechSynthesis.speak(u)}catch(e){fin()}})}
};

/* ---------- listening quiz (Dengar, Ulang kaji) ---------- */
function listenQuiz({title,back='unit',pool,distract,n=10,onDone}){
  const rounds=shuffle(pool).slice(0,n);let i=0,right=0,missed=false,locked=false;
  const draw=()=>{const w=rounds[i];const src=(distract||pool).filter(x=>x!==w&&WORDS[x].pic!==WORDS[w].pic);
    const others=shuffle(src.length>=3?src:ALL_WORDS.filter(x=>x!==w&&WORDS[x].pic!==WORDS[w].pic)).slice(0,3);const opts=shuffle([w,...others]);
    app.innerHTML=bar(title,back,`<span class="pill">${i+1}/${rounds.length}</span>`)+`<div class="col">
      ${progressBar(i,rounds.length)}
      <div class="card col" style="align-items:center;gap:10px"><p style="font-size:22px"><b>Dengar. Pilih gambar yang betul.</b></p><p class="en">Listen, then tap the matching picture.</p>
        <div class="row"><button class="btn audio big" data-act="play">🔊 Dengar</button><button class="btn ghost" data-act="slow">🐢 Perlahan</button></div></div>
      <div class="choices four">${opts.map(o=>`<button class="choice" data-act="pick" data-w="${esc(o)}"><span class="pic">${WORDS[o].pic}</span><span class="lbl" hidden>${esc(WORDS[o].ms)}</span></button>`).join('')}</div>
    </div>`;missed=false;locked=false;V.speak(w,0.8)};
  H.play=()=>V.speak(rounds[i],0.8);H.slow=()=>V.speak(rounds[i],0.5);
  H.pick=async el=>{if(locked)return;const w=rounds[i];
    if(el.dataset.w===w){locked=true;el.classList.add('right');el.querySelector('.lbl').hidden=false;if(!missed)right++;hit(w,!missed);
      await V.speak(w,0.8);await wait(400);i++;if(i<rounds.length)draw();else{save();onDone(right,rounds.length)}}
    else{el.classList.add('wrong');el.querySelector('.lbl').hidden=false;missed=true;V.speak('Cuba lagi. '+w,0.8)}};
  draw();
}
SCREENS.dengar=()=>{const u=U();listenQuiz({title:'Dengar & Pilih',pool:u.wordKeys,n:Math.min(10,u.wordKeys.length),

SCREENS.ulang=()=>{let pool=weakWords();const seen=Object.keys(S.words).filter(w=>WORDS[w]);
  if(pool.length<6)pool=pool.concat(shuffle((seen.length>=6?seen:U().wordKeys).filter(w=>!pool.includes(w)))).slice(0,6);
  listenQuiz({title:'Ulang Kaji',back:'home',pool,distract:ALL_WORDS,n:6,onDone:(r,n)=>{today().review=true;markActive();save();
    document.body.className=S.showEn?'show-en':'';
    app.innerHTML=bar('',null)+`<div class="card celebrate col" style="align-items:center"><div class="big">🔁</div><h1>${pick(PRAISE)}</h1><p style="font-size:22px">${r} / ${n}</p><p class="en">Review done. Words he misses come back here until they stick.</p><button class="btn big" data-act="go" data-to="home">Laman utama</button></div>`;V.speak(pick(PRAISE))}})};

/* ---------- 2. SEBUT ---------- */
function sebutItems(u){if(u.say)return u.say;const ws=u.wordKeys.slice(0,6);const b=u.build;return [...ws,{s:b[0][0],en:b[0][1]},{s:b[b.length-1][0],en:b[b.length-1][1]}]}
SCREENS.sebut=()=>{const items=sebutItems(U()).map(it=>typeof it==='string'?{w:it}:it);let i=0,hard=0;const scored=[];
  const draw=()=>{const it=items[i];const W=it.w?WORDS[it.w]:null;const text=W?W.ms:fill(it.s);const en=W?W.en:fill(it.en);
    const big=W?`<div class="sylrow">${W.syl.map(s=>`<button data-act="syl" data-t="${esc(s)}">${esc(s)}</button>`).join('')}</div><div class="read" style="text-align:center">${W.pic} ${esc(W.ms)}</div><p class="en" style="text-align:center">${esc(en)}</p>`
      :`<div class="read" style="text-align:center">${text.split(' ').map(x=>`<span class="word" data-act="word" data-t="${esc(stripP(x))}">${esc(x)}</span>`).join(' ')}</div><p class="en" style="text-align:center">${esc(en)}</p>`;
    app.innerHTML=bar('Sebut','unit',`<span class="pill">${i+1}/${items.length}</span>`)+`<div class="col">${progressBar(i,items.length)}
      <div class="card col" style="align-items:center">${big}
        <div class="row" style="justify-content:center"><button class="btn audio big" data-act="say" data-t="${esc(text)}">🔊 Dengar</button><button class="btn ghost" data-act="say" data-t="${esc(text)}" data-rate="0.5">🐢 Perlahan</button></div>
        <div class="tip" style="align-self:stretch"><b>Tip sebutan</b> · ${esc(W?tipFor(W.ms):(it.tip||'Read it slowly first, word by word, then say the whole sentence smoothly.'))}</div></div>
      ${micWidget(text,{onNext:advance}).html()}</div>`;
    V.speak(text,0.8)};
  H.syl=async el=>{el.classList.add('lit');await V.speak(el.dataset.t,0.6);el.classList.remove('lit')};
  H.word=async el=>{el.classList.add('lit');await V.speak(el.dataset.t,0.7);el.classList.remove('lit')};
  function advance(stars,rating){const it=items[i];const tough=stars!==null?stars<=1:rating===0;if(tough)hard++;
    if(stars===null&&it.w)hit(it.w,rating>0);if(stars!==null)scored.push(stars);
    if(tough)toast('Tidak mengapa! Kita cuba lagi nanti. (It will come back in review.)');
    i++;if(i<items.length)draw();else{save();const avg=scored.length?scored.reduce((a,b)=>a+b,0)/scored.length:null;
      finish('sebut',avg!==null?Math.max(1,Math.round(avg)):(hard<=2?3:2),`<p class="en">${avg!==null?`Average speaking score: ${avg.toFixed(1)} ★ over ${scored.length} tries. `:''}${hard} item${hard===1?' was':'s were'} tricky; they will come back in review.</p>`)}}
  draw();
};

/* ---------- 3. BINA AYAT ---------- */
const toks=s=>stripP(fill(s)).split(/\s+/).filter(Boolean);
SCREENS.bina=()=>{const B=U().build;let i=0,errors=0,tries=0,placed=[],tiles=[],state='';
  const target=()=>toks(B[i][0]);
  const setup=()=>{tiles=shuffle([...target(),...B[i][3]].map((t,k)=>({t,k})));placed=[];tries=0;state=''};
  const draw=()=>{const it=B[i];const sent=fill(it[0]);
    app.innerHTML=bar('Bina Ayat','unit',`<span class="pill">${i+1}/${B.length}</span>`)+`<div class="col">${progressBar(i,B.length)}
      <div class="card row" style="justify-content:center;gap:18px"><span style="font-size:72px">${it[2]}</span><div class="col" style="gap:6px"><p style="font-size:22px"><b>Susun perkataan menjadi ayat.</b></p><p class="en">Make the sentence: “${esc(fill(it[1]))}”</p><div class="row">${say(sent)}<span class="muted small">Dengar ayat</span></div></div></div>
      <div class="slot ${state}" aria-label="Ayat kamu">${placed.length?placed.map((p,j)=>`<button class="tile placed" data-act="unplace" data-j="${j}">${esc(p.t)}</button>`).join('')+(placed.length===target().length?'<span class="read">.</span>':''):'<span class="muted">Tekan perkataan di bawah…</span>'}</div>
      <div class="tiles">${tiles.map(tl=>`<button class="tile ${placed.includes(tl)?'used':''}" data-act="place" data-k="${tl.k}">${esc(tl.t)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center">${state==='ok'?`<button class="btn big" data-act="next">Seterusnya →</button>`:`<button class="btn ghost" data-act="clear">Padam</button><button class="btn big" data-act="check" ${placed.length===target().length?'':'disabled'}>Semak</button>`}</div>
      ${state==='reveal'?`<div class="tip"><b>Jawapan:</b> <span style="font-size:22px;font-weight:700">${esc(sent)}</span> <span class="en">Look, listen, then build it again.</span></div>`:''}
    </div>`};
  H.place=el=>{if(state==='ok')return;const tl=tiles.find(t=>t.k==el.dataset.k);if(!tl||placed.includes(tl))return;placed.push(tl);V.speak(tl.t,0.85);if(state==='bad')state='';draw()};
  H.unplace=el=>{if(state==='ok')return;placed.splice(+el.dataset.j,1);state=state==='reveal'?'reveal':'';draw()};
  H.clear=()=>{placed=[];if(state!=='reveal')state='';draw()};
  H.check=async()=>{const ok=placed.map(p=>p.t).join(' ')===target().join(' ');
    if(ok){state='ok';draw();await V.speak(pick(PRAISE));await V.speak(fill(B[i][0]),0.85)}
    else{errors++;tries++;state=tries>=2?'reveal':'bad';if(state==='reveal')placed=[];draw();V.speak(state==='reveal'?'Lihat jawapan. '+fill(B[i][0]):'Cuba lagi',0.85)}};
  H.next=()=>{i++;if(i<B.length){setup();draw()}else finish('bina',errors<=1?3:errors<=4?2:1,`<p class="en">${errors} wrong attempt${errors===1?'':'s'} across ${B.length} sentences.</p>`)};
  setup();draw();
};

/* ---------- scene drawing (shared by Cerita Gambar and Ujian Lisan) ---------- */
const SCENE_BG={house:{roof:true,sky:'🏠'},classroom:{roof:true,sky:'🏫'},school:{roof:false,sky:'☀️'},park:{roof:false,sky:'☀️'},beach:{roof:false,sky:'☀️'},field:{roof:false,sky:'☀️'},neighbourhood:{roof:false,sky:'☀️'}};
function zoneKind(p){return /laut|kolam/.test(p)?'water':/pantai/.test(p)?'sand':/taman|padang|pokok|gelanggang|halaman/.test(p)?'grass':/kedai|kantin/.test(p)?'shop':'room'}
function sceneSVG(sc,active,done){const W=600,Ht=430,zw=W/3;const bg=SCENE_BG[sc.bg]||SCENE_BG.park;
  const zones=sc.places.map((p,z)=>{const k=zoneKind(p[0]);const x=z*zw;
    const fill=k==='water'?'var(--sky-soft)':k==='sand'?'var(--kunyit-soft)':k==='grass'?'var(--pandan-soft)':k==='shop'?'var(--songket-soft)':(z%2?'var(--songket-soft)':'var(--kunyit-soft)');
    return `<rect x="${x}" y="${bg.roof?70:60}" width="${zw}" height="${Ht-(bg.roof?70:60)}" style="fill:${fill}"/>
      <text x="${x+zw/2}" y="${bg.roof?150:140}" font-size="58" text-anchor="middle" opacity=".9">${p[1]}</text>
      ${z?`<line x1="${x}" y1="${bg.roof?70:60}" x2="${x}" y2="${Ht}" class="ln"/>`:''}`}).join('');
  const head=bg.roof?`<polygon class="roof" points="0,70 300,8 600,70"/><text x="300" y="58" font-size="26" text-anchor="middle">${bg.sky}</text>`
    :`<rect class="sk" x="0" y="0" width="600" height="60"/><text x="40" y="44" font-size="32" text-anchor="middle">${bg.sky}</text><text x="470" y="40" font-size="26">☁️</text><text x="200" y="36" font-size="22">☁️</text>`;
  const byZone={};sc.people.forEach((p,k)=>{(byZone[p[4]]=byZone[p[4]]||[]).push(k)});
  const people=sc.people.map((p,k)=>{const list=byZone[p[4]];const j=list.indexOf(k);const x=p[4]*zw+zw*(j+1)/(list.length+1);const y=300;
    return `<g class="who ${k===active?'active':''} ${done[k]?'done':''}" data-act="who" data-i="${k}" role="button" aria-label="Orang ${k+1}">
      <circle class="halo" cx="${x}" cy="${y}" r="${list.length>1?44:54}"/>
      <text x="${x}" y="${y+20}" font-size="${list.length>1?52:62}" text-anchor="middle">${p[1]}</text>
      <text x="${x+(list.length>1?30:40)}" y="${y+34}" font-size="30" text-anchor="middle">${p[3]}</text>
      ${done[k]?`<rect class="labbg" x="${x-56}" y="${y+44}" width="112" height="28" rx="8"/><text class="lab" x="${x}" y="${y+65}" text-anchor="middle">${esc(p[0])}</text>`:''}</g>`}).join('');
  return `<svg viewBox="0 0 600 430" role="img" aria-label="Gambar: ${esc(sc.open)}">
  <style>.sk{fill:var(--sky-soft)}.roof{fill:var(--songket)}.ln{stroke:var(--line);stroke-width:3}.lab{fill:var(--ink);font:700 18px Andika,system-ui,sans-serif}.labbg{fill:var(--card)}</style>
  <rect x="0" y="0" width="600" height="430" class="sk"/>${zones}${head}${people}</svg>`}
const sceneSentence=(sc,k)=>{const p=sc.people[k];return `${p[0]} sedang ${p[2]} ${sc.places[p[4]][0]}.`};

/* ---------- 4. CERITA GAMBAR ---------- */
SCREENS.cerita=()=>{const sc=U().scene;let active=0,done=[],sel={},wrong=0,feeling=null,hideText=false;
  const OC={};const optsFor=k=>{const p=sc.people[k];if(!OC[k]){const others=shuffle(sc.people.filter((x,j)=>j!==k));
      OC[k]={who:shuffle([p[0],...[...new Set(others.map(x=>x[0]))].slice(0,2)]),act:shuffle([[p[2],p[3]],...others.filter(x=>x[2]!==p[2]).slice(0,2).map(x=>[x[2],x[3]])])}}return OC[k]};
  const drawBuild=()=>{const p=sc.people[active];const o=optsFor(active);const complete=sel.who&&sel.act&&sel.place;
    app.innerHTML=bar('Cerita Gambar','unit',`<span class="pill">${done.filter(Boolean).length}/${sc.people.length}</span>`)+`<div class="col">
      <div class="scene-wrap">${sceneSVG(sc,active,done)}</div>
      <div class="card col"><div class="row"><h2 class="grow">Roda Cerita</h2><span class="muted small">Tekan orang dalam gambar</span></div>
        <p class="en" style="margin-top:-8px">The Story Wheel: Who? Doing what? Where? (and at the end, how do they feel?). This pattern grows into picture compositions and the oral exam's picture talk.</p>
        <div class="wheel">
          <div class="wq"><h3>${say('Siapa?','sm')} Siapa? <span class="en">Who?</span></h3><div class="opts">${o.who.map(w=>`<button class="opt ${sel.who===w?'sel':''}" data-act="ans" data-q="who" data-v="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>
          <div class="wq"><h3>${say('Buat apa?','sm')} Buat apa? <span class="en">Doing what?</span></h3><div class="opts">${o.act.map(a=>`<button class="opt ${sel.act===a[0]?'sel':''}" data-act="ans" data-q="act" data-v="${esc(a[0])}">${a[1]} ${esc(a[0])}</button>`).join('')}</div></div>
          <div class="wq"><h3>${say('Di mana?','sm')} Di mana? <span class="en">Where?</span></h3><div class="opts">${sc.places.map(a=>`<button class="opt ${sel.place===a[0]?'sel':''}" data-act="ans" data-q="place" data-v="${esc(a[0])}">${a[1]} ${esc(a[0])}</button>`).join('')}</div></div>
        </div>
        ${complete?`<div class="tip row" style="background:var(--pandan-soft)">${say(sceneSentence(sc,active))}<span class="grow" style="font-size:24px;font-weight:700">${esc(sceneSentence(sc,active))}</span></div>
          ${micWidget(sceneSentence(sc,active),{ask:'Sekarang sebut ayat ini.',nextLabel:'Orang seterusnya →',onNext:()=>H.said()}).html()}`:''}
      </div></div>`};
  H.who=el=>{const k=+el.dataset.i;if(k===active)return;active=k;const p=sc.people[k];sel=done[k]?{who:p[0],act:p[2],place:sc.places[p[4]][0]}:{};drawBuild()};
  H.ans=async el=>{const p=sc.people[active];const q=el.dataset.q,v=el.dataset.v;const good={who:p[0],act:p[2],place:sc.places[p[4]][0]}[q];
    if(v===good){sel[q]=v;drawBuild();await V.speak(v,0.85);if(sel.who&&sel.act&&sel.place)V.speak(sceneSentence(sc,active),0.8)}
    else{wrong++;el.classList.add('bad');V.speak('Lihat gambar. Cuba lagi.',0.85)}};
  H.said=()=>{done[active]=true;const nx=sc.people.findIndex((_,k)=>!done[k]);if(nx<0){drawStory();return}active=nx;sel={};drawBuild();toast('Bagus! Tekan orang seterusnya.')};
  const feel=FEELINGS.find(f=>f.t===sc.feel)||FEELINGS[0];
  const drawStory=()=>{const body=sc.people.map((_,k)=>sceneSentence(sc,k));const close=feeling?`Mereka berasa sangat ${feel.t}.`:null;
    const lines=[['Permulaan','Beginning: when and where',[sc.open]],['Isi','Middle: who is doing what, where',body],['Penutup','Ending: how they feel',close?[close]:[]]];
    app.innerHTML=bar('Cerita Penuh','unit')+`<div class="col">
      <div class="scene-wrap">${sceneSVG(sc,-1,sc.people.map(()=>1))}</div>
      ${!close?`<div class="card col"><h2>${say('Bagaimanakah perasaan mereka?')} Bagaimanakah perasaan mereka?</h2><p class="en">How do they feel? Look at their faces.</p>
        <div class="opts row">${FEELINGS.map(f=>`<button class="opt" data-act="feel" data-v="${f.t}">${f.pic} ${f.t}</button>`).join('')}</div></div>`:''}
      <div class="card col story ${hideText?'hidden-text':''}" id="story">
        <div class="row"><h2 class="grow">Cerita Kita</h2>${close?`<button class="btn audio" data-act="readall">🔊 Dengar cerita</button>`:''}</div>
        ${lines.map(([l,le,ls])=>`<div class="lbl">${l} <span class="en" style="text-transform:none;letter-spacing:0">· ${le}</span></div>${ls.map(t=>`<p data-line><span class="t">${esc(t)}</span></p>`).join('')||'<p class="muted small">Pilih perasaan di atas.</p>'}`).join('')}
      </div>
      ${close?`<div class="card col"><h2>Sekarang, ceritakan sendiri!</h2><p class="en">Now he tells the whole story himself. Hide the words and let him use only the picture. Listen for an opening, one sentence per person, and a closing.</p>
        <div class="row" style="justify-content:center"><button class="btn ghost" data-act="hide">${hideText?'Tunjuk perkataan':'Sembunyikan perkataan'}</button><button class="btn big" data-act="told">Saya sudah bercerita! ✓</button></div></div>`:''}
    </div>`};
  H.feel=async el=>{if(el.dataset.v===feel.t){feeling=feel.t;drawStory();await V.speak(`Betul! Mereka berasa sangat ${feel.t}.`)}else{wrong++;el.classList.add('bad');V.speak('Lihat muka mereka.',0.85)}};
  H.readall=async el=>{const ps=[...app.querySelectorAll('#story [data-line]')];el.disabled=true;for(const p of ps){p.classList.add('lit');await V.speak(p.textContent,0.8);p.classList.remove('lit');await wait(200)}el.disabled=false};
  H.hide=()=>{hideText=!hideText;drawStory()};
  H.told=()=>finish('cerita',wrong<=2?3:wrong<=5?2:1,`<p class="en">He built a full picture description: an opening, one "who-doing-where" sentence per person, and a feeling. That is the backbone of P1 to P2 picture talk.</p>`);
  drawBuild();
};

/* ---------- 5. MARI BERBUAL ---------- */
function listMs(arr){if(arr.length<=1)return arr.join('');return arr.slice(0,-1).join(', ')+' dan '+arr[arr.length-1]}
function familyTalk(){const f=fam();const n=childName();const cnt=famCount();const members=FAMILY_IDS.filter(k=>f[k]>0);
  return [
    {q:`Selamat ${new Date().getHours()<12?'pagi':'petang'}! Siapakah nama kamu?`,en:'Hello! What is your name?',opts:[{t:`Nama saya ${n}.`,pic:'🙋'}]},
    {q:'Berapakah umur kamu?',en:'How old are you?',opts:[5,6,7,8].map(a=>({t:`Saya berumur ${NUM[a]} tahun.`,pic:String(a)}))},
    {q:'Ada berapa orang dalam keluarga kamu?',en:'How many people are in your family?',count:true,opts:[cnt-1,cnt,cnt+1].filter(x=>x>=2&&x<=12).map(x=>({t:`Ada ${NUM[x]} orang dalam keluarga saya.`,pic:String(x),good:x===cnt}))},
    {q:'Siapakah ahli keluarga kamu?',en:'Who is in your family?',type:'multi',opts:FAMILY_IDS.map(k=>({k,t:k,pic:WORDS[k].pic})),pre:members},
    {q:'Apakah yang kamu suka buat bersama keluarga?',en:'What do you like to do with your family?',opts:WEEKEND.map(w=>({t:`Saya suka ${w[0]} bersama keluarga saya.`,pic:w[1],en:w[2]}))},
    {q:'Mengapakah kamu sayang keluarga kamu?',en:'Why do you love your family?',opts:[['mereka baik hati','😊'],['mereka menjaga saya','🤗'],['mereka selalu bermain dengan saya','🎲']].map(([x,p])=>({t:`Saya sayang keluarga saya kerana ${x}.`,pic:p}))}]}
function talkSteps(u){if(u.talk==='family')return familyTalk();return u.talk.map(s=>({q:fill(s.q),en:s.en,opts:s.opts.map(o=>({t:fill(o[0]),pic:o[1],en:o[2]}))}))}
SCREENS.bual=c=>{const steps=talkSteps(U());let i=0,log=[],answered=false,challenge=!!c.challenge,revealed=false,countHelp=false;
  const multiStep=steps.find(s=>s.type==='multi');const multi=new Set(multiStep?multiStep.pre:[]);
  const draw=()=>{const st=steps[i];
    const answerUI=()=>{if(answered)return micWidget(log[log.length-1].t,{ask:'Sekarang jawab dengan suara kamu.',onNext:()=>H.nextq()}).html();
      if(challenge&&!revealed)return `<div class="card col" style="align-items:center;text-align:center"><p style="font-size:22px"><b>Jawab dengan suara kamu dahulu!</b></p><p class="en">Challenge mode: he answers aloud first, without choices. Then reveal the choices to check.</p><button class="btn warm big" data-act="reveal">Tunjuk pilihan</button></div>`;
      if(st.type==='multi')return `<div class="answers">${st.opts.map(o=>`<button class="opt ${multi.has(o.k)?'sel':''}" data-act="toggle" data-k="${o.k}" style="font-size:22px">${o.pic} ${o.t}</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn big" data-act="multidone" ${multi.size?'':'disabled'}>Jawab</button></div>`;
      return `${countHelp?`<div class="tip">Mari kira bersama! <span style="font-size:30px">${FAMILY_IDS.flatMap(k=>Array(+fam()[k]||0).fill(WORDS[k].pic)).join(' ')} 🙋</span> <span class="en">Let's count together. Don't forget yourself!</span></div>`:''}
        <div class="answers">${st.opts.map((o,j)=>`<button class="opt" data-act="choose" data-j="${j}" style="font-size:21px;text-align:left"><span style="font-size:26px">${o.pic}</span> ${esc(o.t)}${o.en?` <span class="en">(${esc(o.en)})</span>`:''}</button>`).join('')}</div>`};
    app.innerHTML=bar(challenge?'Berbual · Cabaran':'Mari Berbual','unit',`<span class="pill">${Math.min(i+1,steps.length)}/${steps.length}</span>`)+`<div class="col">
      <div class="chat">${log.map(m=>`<div class="msg ${m.me?'me':''}"><span class="av">${m.me?'🙋':'🧕'}</span><div class="bub">${esc(m.t)}${m.en?`<div class="en">${esc(m.en)}</div>`:''}</div>${say(m.t,'sm')}</div>`).join('')}</div>
      ${answerUI()}</div>`;
    setTimeout(()=>{const last=app.querySelector('.chat .msg:last-child');if(last)last.scrollIntoView({block:'center',behavior:'smooth'})},30)};
  const ask=async()=>{const st=steps[i];log.push({t:st.q,en:st.en});answered=false;revealed=false;countHelp=false;draw();await V.speak(st.q,0.85)};
  const answer=async t=>{log.push({t,me:true});answered=true;draw();await V.speak(t,0.8)};
  H.reveal=()=>{revealed=true;draw()};
  H.choose=el=>{const o=steps[i].opts[+el.dataset.j];if(steps[i].count&&!o.good){el.classList.add('bad');countHelp=true;V.speak('Mari kira bersama!');setTimeout(draw,500);return}answer(o.t)};
  H.toggle=el=>{const k=el.dataset.k;multi.has(k)?multi.delete(k):multi.add(k);el.classList.toggle('sel');V.speak(k);const b=app.querySelector('[data-act=multidone]');if(b)b.disabled=!multi.size};
  H.multidone=()=>{const arr=FAMILY_IDS.filter(k=>multi.has(k));answer(`Ahli keluarga saya ialah ${listMs([...arr,'saya'])}.`)};
  H.nextq=async()=>{i++;if(i<steps.length){ask();return}
    log.push({t:`Syabas, ${childName()}! Kamu pandai berbual.`,en:`Well done, ${childName()}! You are good at conversation.`});draw();await V.speak(log[log.length-1].t);
    finish('bual',3,`<p class="en">${challenge?'Challenge round done: he answered before seeing choices.':'Next time try Challenge mode: he answers before the choices appear. This is how the oral exam works.'}</p>
      <div class="row" style="justify-content:center"><button class="btn warm" data-act="go" data-to="bual" data-p='{"challenge":true}'>Cabaran 🏅</button>${IN_CLAUDE?`<button class="btn audio" data-act="go" data-to="ai">Berbual dengan Cikgu AI 💬</button>`:''}</div>`)};
  ask();
};

/* ---------- Cikgu AI free chat (inside Claude only) ---------- */
SCREENS.ai=()=>{const u=U();const n=childName();const f=fam();const members=FAMILY_IDS.filter(k=>f[k]>0).map(k=>(f[k]>1?f[k]+' x ':'')+k).join(', ')||'not set';
  const vocab=u.wordKeys.join(', ');
  const log=[{who:'cikgu',ms:`Hai ${n}! Cikgu Mira di sini. Hari ini kita berbual tentang "${u.nm}". ${fill(typeof u.talk==='string'?'Siapakah ahli keluarga kamu?':u.talk[0].q)}`,en:`Hi ${n}! Teacher Mira here. Today we chat about "${u.en}".`,frame:''}];
  let busy=false,err='';
  const RULES=`You are "Cikgu Mira", a warm, patient Bahasa Melayu teacher chatting with a 6-7 year old Primary 1 child in Singapore. The child is a BEGINNER and does not speak Malay at home.
Unit topic: ${u.nm} (${u.en}). Child's name: ${n}. ${u.custom==='family'?'Child\'s family: '+members+'.':''}
Unit vocabulary: ${vocab}.
Rules:
- Reply in very simple standard Malay (Singapore MOE primary style). At most 2 short sentences, P1 vocabulary only.
- Praise effort warmly first (e.g. "Bagus!"), then ask exactly ONE simple question about the unit topic the child can answer with a short sentence.
- If the child wrote in English, or the Malay has a mistake or is only a word, put the child's text in fix.said and the correct, complete simple Malay sentence in fix.better, with a one-line English tip for the parent in fix.why. If the child's Malay is fully correct, fix is null.
- Stay on the unit topic. Keep everything child-safe. Never say you are an AI.
- frame: a Malay sentence starter that helps the child answer your question (e.g. "Saya suka ...").
Return ONLY JSON: {"ms":"your reply in Malay","en":"English translation of ms","fix":null or {"said":"...","better":"...","why":"..."},"frame":"..."}`;
  const draw=()=>{const last=log[log.length-1];
    app.innerHTML=bar('Cikgu AI','unit')+`<div class="col">
      <p class="en">Free conversation with an AI teacher about this unit. He can type in Malay, or in English if he's stuck, and Cikgu Mira shows the Malay way to say it.</p>
      <div class="chat">${log.map(m=>`<div class="msg ${m.who==='me'?'me':''}"><span class="av">${m.who==='me'?'🙋':'🧕'}</span><div class="bub">${esc(m.ms)}${m.en?`<div class="en">${esc(m.en)}</div>`:''}
        ${m.fix&&m.fix.better?`<div class="fix">✨ Cara sebut: <b>${esc(m.fix.better)}</b> ${say(m.fix.better,'sm')}<div class="en">${esc(m.fix.why||'')}</div></div>`:''}</div>${m.who==='me'?'':say(m.ms,'sm')}</div>`).join('')}
        ${busy?`<div class="msg"><span class="av">🧕</span><div class="bub muted">Cikgu sedang berfikir…</div></div>`:''}</div>
      ${err?`<div class="notice">${esc(err)}</div>`:''}
      <div class="card col" style="gap:10px">
        ${last.frame?`<div class="row"><span class="muted small">Cuba mula dengan:</span><button class="opt" data-act="frame">${esc(last.frame)}</button></div>`:''}
        <textarea id="ai-in" placeholder="Tulis jawapan kamu di sini…" aria-label="Jawapan kamu"></textarea>
        <div class="row" style="justify-content:flex-end"><button class="btn big" data-act="send" ${busy?'disabled':''}>Hantar ➤</button></div></div></div>`;
    const lastMsg=app.querySelector('.chat .msg:last-child');if(lastMsg)lastMsg.scrollIntoView({block:'center'})};
  H.frame=()=>{const ta=document.getElementById('ai-in');ta.value=log[log.length-1].frame.replace(/\s*(\.\.\.|…)\s*$/,' ');ta.focus()};
  H.send=async()=>{const ta=document.getElementById('ai-in');const text=ta.value.trim();if(!text||busy)return;
    log.push({who:'me',ms:text});busy=true;err='';draw();
    const sample=await getSample();
    if(!sample){busy=false;err='Cikgu AI only works when this page is opened inside Claude.';draw();return}
    const transcript=log.map(m=>(m.who==='me'?'Child: ':'Cikgu Mira: ')+m.ms).join('\n');
    try{const r=await sample.json(RULES+'\n\nConversation so far:\n'+transcript+'\n\nWrite Cikgu Mira\'s next reply as JSON only.',{modelTier:'quick',cache:false});
      const fix=r&&r.fix&&r.fix.better?r.fix:null;if(fix)log[log.length-1].fix=fix;
      log.push({who:'cikgu',ms:String(r.ms||'Bagus!'),en:String(r.en||''),frame:r.frame?String(r.frame):''});busy=false;markActive();save();draw();
      if(fix){await V.speak(fix.better,0.8);await wait(300)}V.speak(String(r.ms||''),0.85)}
    catch(e){busy=false;err=aiErr(e);draw()}};
  draw();V.speak(log[0].ms,0.85);
};

      <div class="card col" style="align-items:center;text-align:center"><span style="font-size:48px">${ST.pic}</span>
        <p class="read">${l[0].split(' ').map(w=>`<span class="word" data-act="w" data-t="${esc(stripP(w))}">${esc(w)}</span>`).join(' ')}</p><p class="en">${esc(l[1])}</p></div>
      ${micWidget(l[0],{ask:'Baca ayat ini dengan kuat.',onNext:st=>{if(st!==null)readStars.push(st);li++;if(li<ST.lines.length)drawAloud();else{
        if(readStars.length)toast('Bacaan: purata '+(readStars.reduce((a,b)=>a+b,0)/readStars.length).toFixed(1)+' ★');drawQ()}}}).html()}</div>`};

/* ---------- 7. TULIS ---------- */
function siblingsPhrase(){const f=fam();const parts=['abang','kakak','adik'].filter(k=>f[k]>0).map(k=>(f[k]==1?'seorang':NUM[f[k]]+' orang')+' '+k);return parts.length?listMs(parts):null}
function familyComp(){const f=fam();const cnt=famCount();const sib=siblingsPhrase();
  return [{fixed:`Nama saya ${childName()}.`},{fixed:`Saya berumur ${NUM[+S.profile.age]||'tujuh'} tahun.`},
    {pre:'Ada',post:'orang dalam keluarga saya.',opts:[cnt-1,cnt,cnt+1].filter(x=>x>=2&&x<=12).map(x=>[NUM[x],String(x)]),good:NUM[cnt],en:'How many people, counting himself?'},
    f.ayah>0?{pre:'Ayah saya seorang',post:'.',opts:JOBS,en:"What is Dad's job? (pick the real one)"}:null,
    f.ibu>0?{pre:'Ibu saya seorang',post:'.',opts:JOBS,en:"What is Mum's job?"}:null,
    sib?{fixed:`Saya ada ${sib}.`,note:'seorang = one (person). dua orang = two (people).'}:null,
    {pre:'Pada hujung minggu, kami suka',post:'bersama-sama.',opts:WEEKEND,en:'What do you like to do together at the weekend?'},
    {fixed:'Saya sayang keluarga saya.'}].filter(Boolean)}
function unitComp(u){if(u.write==='family')return familyComp();return u.write.lines.map(l=>typeof l==='string'?{fixed:fill(l)}:{pre:fill(l[0]),post:l[1],opts:l[2],en:l[3]})}
function spellWords(u){const ws=u.wordKeys.filter(w=>!/\s|-/.test(w)&&WORDS[w].syl.length>=2&&WORDS[w].syl.length<=4);return shuffle(ws).slice(0,6)}
SCREENS.tulis=()=>{const u=U();let si=0,errors=0,slots=[],tiles=[],state='';const words=spellWords(u);const sylPool=[...new Set(ALL_WORDS.flatMap(w=>WORDS[w].syl))];
  const setupSpell=()=>{const w=WORDS[words[si]];const others=shuffle(sylPool.filter(s=>!w.syl.includes(s))).slice(0,2);
    tiles=shuffle([...w.syl,...others].map((t,k)=>({t,k})));slots=[];state=''};
  const drawSpell=()=>{const w=WORDS[words[si]];
    app.innerHTML=bar('Tulis · Eja','unit',`<span class="pill">${si+1}/${words.length}</span>`)+`<div class="col">${progressBar(si,words.length)}
      <div class="card row" style="justify-content:center;gap:20px"><span style="font-size:90px">${w.pic}</span><div class="col" style="gap:8px"><p style="font-size:22px"><b>Eja perkataan ini.</b></p><p class="en">Spell the word with syllable tiles: ${esc(w.en)}</p><div class="row">${say(w.ms)}<button class="btn ghost" data-act="say" data-t="${esc(w.syl.join(' '))}" data-rate="0.5">🐢 Suku kata</button></div></div></div>
      <div class="slot ${state}" style="justify-content:center">${w.syl.map((_,j)=>`<button class="tile placed syl" data-act="unslot" data-j="${j}" style="min-width:80px;${slots[j]?'':'opacity:.35'}">${slots[j]?esc(slots[j].t):'?'}</button>`).join('')}</div>
      <div class="tiles">${tiles.map(tl=>`<button class="tile syl ${slots.includes(tl)?'used':''}" data-act="slot" data-k="${tl.k}">${esc(tl.t)}</button>`).join('')}</div>
      ${state==='ok'?`<div class="tip" style="text-align:center"><b>Salin ke dalam buku tulis kamu:</b> <span class="read" style="font-size:30px">${esc(w.ms)}</span><div class="en">Have him copy the word into his exercise book. Handwriting is part of the P1 writing outcome.</div></div><div class="row" style="justify-content:center"><button class="btn big" data-act="nextspell">Seterusnya →</button></div>`:''}
    </div>`};
  H.slot=async el=>{if(state==='ok')return;const tl=tiles.find(t=>t.k==el.dataset.k);const w=WORDS[words[si]];if(slots.includes(tl))return;const j=slots.findIndex(x=>!x);const pos=j<0?slots.length:j;if(pos>=w.syl.length)return;slots[pos]=tl;V.speak(tl.t,0.6);
    if(slots.filter(Boolean).length===w.syl.length){if(slots.map(s=>s.t).join('')===w.ms){state='ok';drawSpell();await wait(400);V.speak(pick(PRAISE)+' '+w.ms,0.8)}else{errors++;state='bad';drawSpell();V.speak('Cuba lagi',0.85);setTimeout(()=>{slots=[];state='';drawSpell()},900)}}else drawSpell()};
  H.unslot=el=>{if(state==='ok')return;slots[+el.dataset.j]=undefined;drawSpell()};
  H.nextspell=()=>{si++;if(si<words.length){setupSpell();drawSpell()}else drawComp()};
  const comp=unitComp(u);const pickd={};const title=u.custom==='family'?'Keluarga Saya':u.nm;
  const lineText=(c,k)=>c.fixed||(`${c.pre} ${pickd[k]||'___'}${c.post==='.'?'.':' '+c.post}`);
  const drawComp=()=>{const ready=comp.every((c,k)=>c.fixed||pickd[k]);
    app.innerHTML=bar('Tulis · Karangan Saya','unit')+`<div class="col">
      <div class="card col" style="gap:6px"><h2>${esc(title)}</h2><p class="en">His own mini-composition about his real life. Choose the words together; he reads each sentence aloud, then copies it into his exercise book.</p></div>
      ${comp.map((c,k)=>`<div class="card col" style="gap:10px"><div class="row">${say(lineText(c,k).replace('___','...'),'sm')}<p class="grow" style="font-size:24px;font-weight:700">${esc(lineText(c,k))}</p></div>
        ${c.note?`<p class="en">${c.note}</p>`:''}
        ${c.opts?`<p class="en">${esc(c.en||'')}</p><div class="answers">${c.opts.map(o=>`<button class="opt ${pickd[k]===o[0]?'sel':''}" data-act="cpick" data-k="${k}" data-v="${esc(o[0])}">${o[1]} ${esc(o[0])}${o[2]?` <span class="en">(${esc(o[2])})</span>`:''}</button>`).join('')}</div>`:''}</div>`).join('')}
      <div class="row" style="justify-content:center"><button class="btn big warm" data-act="makebook" ${ready?'':'disabled'}>Jadikan buku saya 📘</button></div></div>`};
  H.cpick=el=>{const k=+el.dataset.k,v=el.dataset.v;const c=comp[k];if(c.good&&v!==c.good){errors++;el.classList.add('bad');V.speak('Mari kira lagi. Jangan lupa diri kamu!',0.85);toast("Count again. Don't forget himself!");return}
    pickd[k]=v;const y=scrollY;drawComp();scrollTo(0,y);V.speak(lineText(c,k),0.8)};
  H.makebook=()=>{const lines=comp.map((c,k)=>lineText(c,k));const d=todayStr();S.book=S.book.filter(b=>!(b.date===d&&b.unit===u.id));S.book.push({date:d,unit:u.id,title,lines});save();
    finish('tulis',errors<=2?3:errors<=5?2:1,`<div class="book" style="text-align:left;align-self:stretch"><h2>${esc(title)}</h2>${lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn audio" data-act="go" data-to="book">Buka Buku Saya 📘</button></div>`)};
  if(words.length){setupSpell();drawSpell()}else drawComp();
};

  const draw=()=>{app.innerHTML=bar('Buku Saya','home')+`<div class="col">
    ${pages.length?pages.map((b,ix)=>`<div class="book"><div class="row"><h2 class="grow">${esc(b.title)}</h2><button class="btn audio" data-act="readbook" data-ix="${ix}">🔊 Baca</button></div><p class="muted small" style="line-height:1.4">${esc(childName())} · ${esc(b.date)}</p>${b.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`).join('')

        ${res.ayat?`<button class="btn ghost" data-act="addline">Tambah ke buku saya</button>`:''}</div>`:''}

  H.readbook=async el=>{const b=pages[+el.dataset.ix];for(const l of b.lines){await V.speak(l,0.8);await wait(150)}};

Sentence: """${t}"""
If it is English or has mistakes, give the simplest correct standard Malay version (P1 vocabulary) that keeps the child's meaning. Return ONLY JSON:
{"betul": true|false, "ayat": "the correct full sentence, with capital letter and full stop", "pujian": "one short Malay praise for the child", "tip": "one short English explanation for the parent of what was fixed, or what was good"}`,{modelTier:'default'});
      res={betul:!!r.betul,ayat:String(r.ayat||''),pujian:String(r.pujian||''),tip:String(r.tip||'')};busy=false;draw();document.getElementById('own').value=t;if(res.ayat)V.speak((res.pujian||'')+' '+res.ayat,0.85)}
    catch(e){busy=false;err=aiErr(e);draw();document.getElementById('own').value=t}};
  H.addline=()=>{if(!res||!res.ayat)return;if(!S.book.length)S.book.push({date:todayStr(),unit:S.cu,title:U().nm,lines:[]});const b=S.book[S.book.length-1];b.lines.splice(Math.max(0,b.lines.length-1),0,res.ayat);save();res=null;go('book')};

/* ---------- PARENT CORNER ---------- */
function micStatus(){
  if(IN_CLAUDE)return `<div class="notice">Inside Claude the microphone is blocked, so lessons use faces for self-rating. Use the standalone version (GitHub Pages) on the iPad to have the app listen to him.</div>`;
  const rec=!!Mic.Rec,rc=!!(navigator.mediaDevices&&window.MediaRecorder);

function pronSummary(){const log=(S.pron&&S.pron.log)||[];if(!log.length)return '<p class="small muted">No speaking scores yet. They appear after he uses the 🎤 button.</p>';
